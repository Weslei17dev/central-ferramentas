<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Ferramentas — Editor de Relatório</title>

  <script>
    document.documentElement.dataset.theme = localStorage.getItem("ctf_tema") || "dark";
  </script>

  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
</head>
<body data-module="relatorios">
  <div class="app-shell">
    <div id="app-sidebar"></div>
    <div id="app-header"></div>

    <main class="app-main">
      <a href="index.html" class="btn btn-ghost" style="padding-left:0; margin-bottom:8px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg>
        Voltar para Relatórios
      </a>

      <div class="page-header">
        <div style="flex:1;">
          <div style="display:flex; align-items:center; gap:10px;">
            <h1 id="titulo-relatorio" contenteditable="true" style="outline:none;">Relatório</h1>
            <span class="badge" id="badge-status"></span>
          </div>
          <p style="color:var(--muted); margin-top:4px;" id="descricao-relatorio" contenteditable="true">Clique para adicionar uma descrição...</p>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-secondary" id="botao-modo">Modo: Edição</button>
          <button class="btn btn-secondary" id="botao-publicar"></button>
          <button class="btn btn-secondary" id="botao-excluir-relatorio" style="color:var(--danger);">Excluir</button>
        </div>
      </div>

      <div id="area-blocos" class="grid-blocos"></div>

      <button class="btn btn-primary" id="botao-add-bloco" style="width:100%; height:44px; border-style:dashed; margin-top:16px;">
        + Adicionar bloco
      </button>
    </main>
  </div>

  <!-- Modal: adicionar/editar bloco -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal modal--largo">
      <div class="modal-header">
        <h3 id="modal-titulo">Novo bloco</h3>
        <button class="icon-btn" id="modal-fechar" aria-label="Fechar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <input type="hidden" id="campo-id" />

      <div class="opcoes-tipo-bloco" style="grid-template-columns: repeat(5, 1fr);">
        <div class="opcao-tipo-bloco" data-tipo="kpi">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3v18h18"/><circle cx="16" cy="9" r="2"/></svg>
          Número
        </div>
        <div class="opcao-tipo-bloco" data-tipo="barras">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h10M4 12h16M4 18h7"/></svg>
          Barras (h)
        </div>
        <div class="opcao-tipo-bloco" data-tipo="colunas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V10M10 20V4M16 20v-7"/></svg>
          Colunas (v)
        </div>
        <div class="opcao-tipo-bloco" data-tipo="rosca">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 9 9h-9z"/></svg>
          Rosca
        </div>
        <div class="opcao-tipo-bloco" data-tipo="tabela">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 10h18M9 4v16"/></svg>
          Tabela
        </div>
      </div>

      <div style="display:flex; gap:10px;">
        <div class="field" style="flex:2;">
          <label for="campo-titulo-bloco">Título do bloco *</label>
          <input class="input" id="campo-titulo-bloco" placeholder="Ex: Faturamento por cliente" />
        </div>
        <div class="field" style="flex:1;">
          <label for="campo-largura">Largura</label>
          <select class="input" id="campo-largura">
            <option value="completa">Completa</option>
            <option value="metade">Metade</option>
            <option value="terco">Um terço</option>
          </select>
        </div>
      </div>

      <!-- Config: KPI (usa uma Métrica já criada) -->
      <div id="config-kpi" hidden>
        <div class="field">
          <label for="campo-metrica">Métrica *</label>
          <select class="input" id="campo-metrica"></select>
        </div>
        <p style="font-size:12px; color:var(--muted);">Não achou a métrica que precisa? <a href="metricas.html" style="color:var(--accent);">Crie uma nova</a> e volte aqui.</p>
      </div>

      <!-- Config: Barras / Colunas / Rosca (agrupamento) -->
      <div id="config-grafico" hidden>
        <div class="field">
          <label for="campo-tabela-g">Tabela *</label>
          <select class="input" id="campo-tabela-g"></select>
        </div>
        <div style="display:flex; gap:10px;">
          <div class="field" style="flex:1;">
            <label for="campo-agrupador">Agrupar por *</label>
            <select class="input" id="campo-agrupador"></select>
          </div>
          <div class="field" style="flex:1;">
            <label for="campo-agregacao-g">Agregação *</label>
            <select class="input" id="campo-agregacao-g"></select>
          </div>
        </div>
        <div class="field">
          <label for="campo-valor-g">Campo numérico (se não for Contagem)</label>
          <select class="input" id="campo-valor-g"><option value="">—</option></select>
        </div>
      </div>

      <!-- Config: Tabela -->
      <div id="config-tabela" hidden>
        <div class="field">
          <label for="campo-tabela-t">Tabela *</label>
          <select class="input" id="campo-tabela-t"></select>
        </div>

        <div style="display:flex; gap:16px; margin-bottom:10px;">
          <label style="display:flex; align-items:center; gap:6px; font-size:13px;">
            <input type="radio" name="modo-tabela" value="dados" checked /> Dados brutos
          </label>
          <label style="display:flex; align-items:center; gap:6px; font-size:13px;">
            <input type="radio" name="modo-tabela" value="medidas" /> Agrupada com medidas
          </label>
        </div>

        <div id="tabela-modo-dados">
          <div class="field">
            <label>Colunas a mostrar</label>
            <div id="lista-colunas-checkbox" style="display:flex; flex-wrap:wrap; gap:10px;"></div>
          </div>
        </div>

        <div id="tabela-modo-medidas" hidden>
          <div class="field">
            <label for="campo-agrupador-t">Agrupar por *</label>
            <select class="input" id="campo-agrupador-t"></select>
          </div>
          <div class="field">
            <label>Métricas como colunas (só as da mesma tabela acima)</label>
            <div id="lista-metricas-checkbox" style="display:flex; flex-wrap:wrap; gap:10px;"></div>
            <p style="font-size:11px; color:var(--muted); margin-top:6px;">Não aparece nenhuma métrica? Crie uma para esta tabela em <a href="metricas.html" style="color:var(--accent);">Métricas</a>.</p>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-excluir-bloco" style="margin-right:auto; color:var(--danger); display:none;">Remover bloco</button>
        <button class="btn btn-secondary" id="modal-cancelar">Cancelar</button>
        <button class="btn btn-primary" id="modal-salvar">Salvar bloco</button>
      </div>
    </div>
  </div>

  <script>const CTF_RAIZ = "../";</script>

  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/events.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/db.js"></script>
  <script src="../assets/js/catalogo-relatorios.js"></script>
  <script src="../assets/js/catalogo-menu.js"></script>
  <script src="../assets/js/partials.js"></script>
  <script src="../assets/js/app-shell.js" defer></script>

  <script defer>
    const relatorioId = new URLSearchParams(window.location.search).get("id");
    let modoEdicao = true;
    let tipoBlocoSelecionado = null;

    function relatorioAtual() { return getPorId("relatorios", relatorioId); }

    function salvarCamposTexto() {
      const nome = document.getElementById("titulo-relatorio").textContent.trim() || "Relatório sem nome";
      const descricao = document.getElementById("descricao-relatorio").textContent.trim();
      atualizar("relatorios", relatorioId, { nome, descricao });
    }

    function construirConicGradient(dados) {
      const total = dados.reduce((s, d) => s + d.valor, 0) || 1;
      let acumulado = 0;
      return `conic-gradient(${dados.map((d, i) => {
        const inicio = (acumulado / total) * 360;
        acumulado += d.valor;
        return `${corParaIndice(i)} ${inicio}deg ${(acumulado / total) * 360}deg`;
      }).join(", ")})`;
    }

    function blocoEstaConfigurado(bloco) {
      if (bloco.tipo === "kpi") return !!bloco.metricaId;
      if (bloco.tipo === "barras" || bloco.tipo === "colunas" || bloco.tipo === "rosca") return !!(bloco.tabela && bloco.campoAgrupador && bloco.agregacao);
      if (bloco.tipo === "tabela") return bloco.modo === "medidas" ? !!(bloco.tabela && bloco.campoAgrupador && (bloco.metricaIds || []).length) : !!bloco.tabela;
      return false;
    }

    function renderizarBloco(bloco) {
      const acoesEdicao = modoEdicao ? `
        <div class="bloco-acoes">
          <button class="icon-btn" data-editar-bloco="${bloco.id}" title="Editar bloco">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button>
          <button class="icon-btn excluir" data-remover-bloco="${bloco.id}" title="Remover bloco">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
          </button>
        </div>` : "";

      const largura = bloco.largura || "completa";
      let conteudo = "";

      if (!blocoEstaConfigurado(bloco)) {
        conteudo = `<p style="color:var(--muted); font-size:13px;">Bloco ainda não configurado — clique no lápis para escolher os dados.</p>`;
      } else if (bloco.tipo === "kpi") {
        const metrica = getPorId("metricas", bloco.metricaId);
        let valor = "—";
        if (metrica) {
          const filtro = metrica.filtroCampo ? { campo: metrica.filtroCampo, operador: metrica.filtroOperador, valor: metrica.filtroValor } : null;
          const r = calcularAgregacao(metrica.tabela, metrica.campo, metrica.agregacao, filtro);
          valor = typeof r === "number" ? (Number.isInteger(r) ? r : r.toFixed(2)) : r;
        }
        conteudo = `<div class="bloco-kpi-valor">${valor}</div>`;
      } else if (bloco.tipo === "barras" || bloco.tipo === "colunas") {
        const filtro = bloco.filtroCampo ? { campo: bloco.filtroCampo, operador: bloco.filtroOperador, valor: bloco.filtroValor } : null;
        const dados = agruparEAgregar(bloco.tabela, bloco.campoValor, bloco.agregacao, bloco.campoAgrupador, filtro).slice(0, 8);
        const maximo = Math.max(1, ...dados.map((d) => d.valor));

        if (dados.length === 0) {
          conteudo = '<p style="color:var(--muted); font-size:13px;">Sem dados para mostrar.</p>';
        } else if (bloco.tipo === "barras") {
          conteudo = dados.map((d, i) => `
            <div class="barra-linha">
              <span class="barra-nome">${d.chave}</span>
              <div class="barra-trilha"><div class="barra-preenchimento" style="width:${(d.valor / maximo) * 100}%; background:${corParaIndice(i)}"></div></div>
              <span class="barra-valor">${Number.isInteger(d.valor) ? d.valor : d.valor.toFixed(1)}</span>
            </div>`).join("");
        } else {
          conteudo = `<div class="grafico-colunas">${dados.map((d, i) => `
            <div class="coluna-item">
              <span class="coluna-valor">${Number.isInteger(d.valor) ? d.valor : d.valor.toFixed(1)}</span>
              <div class="coluna-barra" style="height:${(d.valor / maximo) * 100}%; background:${corParaIndice(i)}"></div>
              <span class="coluna-rotulo">${d.chave}</span>
            </div>`).join("")}</div>`;
        }
      } else if (bloco.tipo === "rosca") {
        const filtro = bloco.filtroCampo ? { campo: bloco.filtroCampo, operador: bloco.filtroOperador, valor: bloco.filtroValor } : null;
        const dados = agruparEAgregar(bloco.tabela, bloco.campoValor, bloco.agregacao, bloco.campoAgrupador, filtro).slice(0, 8);
        conteudo = dados.length ? `
          <div class="grafico-rosca-wrap">
            <div class="grafico-rosca" style="background:${construirConicGradient(dados)}"></div>
            <div class="grafico-rosca-legenda">
              ${dados.map((d, i) => `
                <div class="legenda-item">
                  <span class="legenda-cor" style="background:${corParaIndice(i)}"></span>
                  ${d.chave}
                  <span class="legenda-valor">${Number.isInteger(d.valor) ? d.valor : d.valor.toFixed(1)}</span>
                </div>`).join("")}
            </div>
          </div>` : '<p style="color:var(--muted); font-size:13px;">Sem dados para mostrar.</p>';
      } else if (bloco.tipo === "tabela" && bloco.modo === "medidas") {
        const metricas = (bloco.metricaIds || []).map((id) => getPorId("metricas", id)).filter(Boolean);
        const linhas = tabelaDeMedidas(bloco.tabela, bloco.campoAgrupador, bloco.metricaIds || []);
        const defAgrupador = obterCampoCatalogo(bloco.tabela, bloco.campoAgrupador);
        conteudo = `
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th>${defAgrupador?.rotulo || ""}</th>${metricas.map((m) => `<th style="text-align:right;">${m.nome}</th>`).join("")}</tr></thead>
              <tbody>
                ${linhas.length ? linhas.map((l) => `<tr><td>${l.grupo}</td>${metricas.map((m) => `<td style="text-align:right;">${Number.isInteger(l.valores[m.id]) ? l.valores[m.id] : l.valores[m.id].toFixed(2)}</td>`).join("")}</tr>`).join("")
                  : `<tr><td colspan="${metricas.length + 1}" style="text-align:center; color:var(--muted); padding:16px;">Sem dados.</td></tr>`}
              </tbody>
            </table>
          </div>`;
      } else if (bloco.tipo === "tabela") {
        const def = obterTabelaCatalogo(bloco.tabela);
        const colunas = def.campos.filter((c) => (bloco.colunas || []).includes(c.chave));
        const registros = getAll(bloco.tabela).slice().reverse().slice(0, 15);
        conteudo = `
          <div class="table-wrap">
            <table class="table">
              <thead><tr>${colunas.map((c) => `<th>${c.rotulo}</th>`).join("")}</tr></thead>
              <tbody>
                ${registros.length ? registros.map((r) => `<tr>${colunas.map((c) => `<td>${resolverValorCampo(r, c) ?? ""}</td>`).join("")}</tr>`).join("")
                  : `<tr><td colspan="${colunas.length}" style="text-align:center; color:var(--muted); padding:16px;">Nenhum registro ainda.</td></tr>`}
              </tbody>
            </table>
          </div>`;
      }

      return `
        <div class="bloco-relatorio largura-${largura}">
          ${acoesEdicao}
          <div class="bloco-relatorio-titulo">${bloco.titulo}</div>
          ${conteudo}
        </div>`;
    }

    function renderizarPagina() {
      const relatorio = relatorioAtual();
      if (!relatorio) {
        document.getElementById("area-blocos").innerHTML = '<div class="empty-state">Relatório não encontrado. <a href="index.html">Voltar</a></div>';
        return;
      }
      document.getElementById("titulo-relatorio").textContent = relatorio.nome;
      document.getElementById("descricao-relatorio").textContent = relatorio.descricao || "Clique para adicionar uma descrição...";
      document.getElementById("badge-status").className = `badge ${relatorio.publicado ? "badge--success" : "badge--warning"}`;
      document.getElementById("badge-status").textContent = relatorio.publicado ? "Publicado" : "Rascunho";
      document.getElementById("botao-publicar").textContent = relatorio.publicado ? "Despublicar" : "Publicar";

      document.getElementById("titulo-relatorio").contentEditable = modoEdicao;
      document.getElementById("descricao-relatorio").contentEditable = modoEdicao;
      document.getElementById("botao-add-bloco").hidden = !modoEdicao;
      document.getElementById("botao-modo").textContent = modoEdicao ? "Modo: Edição" : "Modo: Visualização";

      const blocos = relatorio.blocos || [];
      document.getElementById("area-blocos").innerHTML = blocos.length
        ? blocos.map(renderizarBloco).join("")
        : '<div class="empty-state" style="flex:1 1 100%;"><h3>Nenhum bloco ainda</h3><p>Clique em "Adicionar bloco" para começar.</p></div>';
    }

    /* ---------- Modal de bloco ---------- */
    function popularSelectsBloco() {
      const metricas = getAll("metricas");
      document.getElementById("campo-metrica").innerHTML = metricas.length
        ? metricas.map((m) => `<option value="${m.id}">${m.nome}</option>`).join("")
        : '<option value="">Nenhuma métrica cadastrada ainda</option>';

      ["campo-tabela-g", "campo-tabela-t"].forEach((id) => {
        document.getElementById(id).innerHTML = CATALOGO_TABELAS.map((t) => `<option value="${t.tabela}">${t.rotulo}</option>`).join("");
      });
      document.getElementById("campo-agregacao-g").innerHTML = AGREGACOES.map((a) => `<option value="${a.chave}">${a.rotulo}</option>`).join("");

      atualizarCamposDaTabelaGrafico();
      atualizarConfigTabela();
    }

    function atualizarCamposDaTabelaGrafico() {
      const def = obterTabelaCatalogo(document.getElementById("campo-tabela-g").value);
      if (!def) return;
      document.getElementById("campo-agrupador").innerHTML = def.campos
        .filter((c) => c.tipo !== "numero")
        .map((c) => `<option value="${c.chave}">${c.rotulo}</option>`).join("");
      document.getElementById("campo-valor-g").innerHTML =
        '<option value="">—</option>' + def.campos.filter((c) => c.tipo === "numero").map((c) => `<option value="${c.chave}">${c.rotulo}</option>`).join("");
    }

    function atualizarConfigTabela() {
      const tabela = document.getElementById("campo-tabela-t").value;
      const def = obterTabelaCatalogo(tabela);
      if (!def) return;

      document.getElementById("lista-colunas-checkbox").innerHTML = def.campos.map((c) => `
        <label style="display:flex; align-items:center; gap:6px; font-size:13px;">
          <input type="checkbox" class="chk-coluna" value="${c.chave}" checked /> ${c.rotulo}
        </label>`).join("");

      document.getElementById("campo-agrupador-t").innerHTML = def.campos
        .filter((c) => c.tipo !== "numero")
        .map((c) => `<option value="${c.chave}">${c.rotulo}</option>`).join("");

      const metricasDaTabela = getAll("metricas").filter((m) => m.tabela === tabela);
      document.getElementById("lista-metricas-checkbox").innerHTML = metricasDaTabela.length
        ? metricasDaTabela.map((m) => `
            <label style="display:flex; align-items:center; gap:6px; font-size:13px;">
              <input type="checkbox" class="chk-metrica" value="${m.id}" /> ${m.nome}
            </label>`).join("")
        : '<p style="font-size:12px; color:var(--muted);">Nenhuma métrica cadastrada para esta tabela ainda.</p>';
    }

    document.getElementById("campo-tabela-g").addEventListener("change", atualizarCamposDaTabelaGrafico);
    document.getElementById("campo-tabela-t").addEventListener("change", atualizarConfigTabela);
    document.querySelectorAll('input[name="modo-tabela"]').forEach((radio) => {
      radio.addEventListener("change", () => {
        const medidas = document.querySelector('input[name="modo-tabela"]:checked').value === "medidas";
        document.getElementById("tabela-modo-dados").hidden = medidas;
        document.getElementById("tabela-modo-medidas").hidden = !medidas;
      });
    });

    function selecionarTipoBloco(tipo) {
      tipoBlocoSelecionado = tipo;
      document.querySelectorAll(".opcao-tipo-bloco").forEach((el) => el.classList.toggle("selecionada", el.dataset.tipo === tipo));
      document.getElementById("config-kpi").hidden = tipo !== "kpi";
      document.getElementById("config-grafico").hidden = !(tipo === "barras" || tipo === "colunas" || tipo === "rosca");
      document.getElementById("config-tabela").hidden = tipo !== "tabela";
    }
    document.querySelectorAll(".opcao-tipo-bloco").forEach((el) => el.addEventListener("click", () => selecionarTipoBloco(el.dataset.tipo)));

    function abrirModalBloco(bloco = null) {
      popularSelectsBloco();
      document.getElementById("modal-titulo").textContent = bloco ? "Editar bloco" : "Novo bloco";
      document.getElementById("modal-excluir-bloco").style.display = bloco ? "inline-flex" : "none";
      document.getElementById("campo-id").value = bloco?.id || "";
      document.getElementById("campo-titulo-bloco").value = bloco?.titulo && bloco.titulo !== "Configurar bloco" ? bloco.titulo : "";
      document.getElementById("campo-largura").value = bloco?.largura || "completa";
      selecionarTipoBloco(bloco?.tipo || "kpi");

      document.querySelector('input[name="modo-tabela"][value="dados"]').checked = true;
      document.getElementById("tabela-modo-dados").hidden = false;
      document.getElementById("tabela-modo-medidas").hidden = true;

      if (bloco?.tipo === "kpi") document.getElementById("campo-metrica").value = bloco.metricaId || "";
      if (bloco?.tipo === "barras" || bloco?.tipo === "colunas" || bloco?.tipo === "rosca") {
        if (bloco.tabela) {
          document.getElementById("campo-tabela-g").value = bloco.tabela;
          atualizarCamposDaTabelaGrafico();
          document.getElementById("campo-agrupador").value = bloco.campoAgrupador || "";
          document.getElementById("campo-agregacao-g").value = bloco.agregacao || "contagem";
          document.getElementById("campo-valor-g").value = bloco.campoValor || "";
        }
      }
      if (bloco?.tipo === "tabela" && bloco.tabela) {
        document.getElementById("campo-tabela-t").value = bloco.tabela;
        atualizarConfigTabela();
        if (bloco.modo === "medidas") {
          document.querySelector('input[name="modo-tabela"][value="medidas"]').checked = true;
          document.getElementById("tabela-modo-dados").hidden = true;
          document.getElementById("tabela-modo-medidas").hidden = false;
          document.getElementById("campo-agrupador-t").value = bloco.campoAgrupador || "";
          document.querySelectorAll(".chk-metrica").forEach((cb) => { cb.checked = (bloco.metricaIds || []).includes(cb.value); });
        } else {
          document.querySelectorAll(".chk-coluna").forEach((cb) => { cb.checked = (bloco.colunas || []).includes(cb.value); });
        }
      }

      document.getElementById("modal-backdrop").hidden = false;
      document.getElementById("campo-titulo-bloco").focus();
    }
    function fecharModalBloco() { document.getElementById("modal-backdrop").hidden = true; }

    function salvarBloco() {
      const id = document.getElementById("campo-id").value;
      const titulo = document.getElementById("campo-titulo-bloco").value.trim();
      if (!titulo || !tipoBlocoSelecionado) { document.getElementById("campo-titulo-bloco").focus(); return; }

      let novoBloco = { id: id || gerarId(), tipo: tipoBlocoSelecionado, titulo, largura: document.getElementById("campo-largura").value };

      if (tipoBlocoSelecionado === "kpi") {
        novoBloco.metricaId = document.getElementById("campo-metrica").value;
      } else if (tipoBlocoSelecionado === "barras" || tipoBlocoSelecionado === "colunas" || tipoBlocoSelecionado === "rosca") {
        novoBloco.tabela = document.getElementById("campo-tabela-g").value;
        novoBloco.campoAgrupador = document.getElementById("campo-agrupador").value;
        novoBloco.agregacao = document.getElementById("campo-agregacao-g").value;
        novoBloco.campoValor = document.getElementById("campo-valor-g").value || null;
      } else if (tipoBlocoSelecionado === "tabela") {
        novoBloco.tabela = document.getElementById("campo-tabela-t").value;
        novoBloco.modo = document.querySelector('input[name="modo-tabela"]:checked').value;
        if (novoBloco.modo === "medidas") {
          novoBloco.campoAgrupador = document.getElementById("campo-agrupador-t").value;
          novoBloco.metricaIds = Array.from(document.querySelectorAll(".chk-metrica:checked")).map((cb) => cb.value);
        } else {
          novoBloco.colunas = Array.from(document.querySelectorAll(".chk-coluna:checked")).map((cb) => cb.value);
        }
      }

      const relatorio = relatorioAtual();
      const blocos = relatorio.blocos || [];
      const indiceExistente = blocos.findIndex((b) => b.id === novoBloco.id);
      if (indiceExistente > -1) blocos[indiceExistente] = novoBloco;
      else blocos.push(novoBloco);
      atualizar("relatorios", relatorioId, { blocos });

      fecharModalBloco();
      renderizarPagina();
    }

    function removerBloco(id) {
      if (!confirm("Remover este bloco do relatório?")) return;
      const relatorio = relatorioAtual();
      const blocos = (relatorio.blocos || []).filter((b) => b.id !== id);
      atualizar("relatorios", relatorioId, { blocos });
      renderizarPagina();
    }

    window.addEventListener("ctf:shell-pronto", () => {
      renderizarPagina();
      onDadosMudarem("relatorios", renderizarPagina);
      onDadosMudarem("metricas", renderizarPagina);
    });

    document.getElementById("titulo-relatorio").addEventListener("blur", salvarCamposTexto);
    document.getElementById("descricao-relatorio").addEventListener("blur", salvarCamposTexto);

    document.getElementById("botao-modo").addEventListener("click", () => { modoEdicao = !modoEdicao; renderizarPagina(); });
    document.getElementById("botao-publicar").addEventListener("click", () => {
      const relatorio = relatorioAtual();
      atualizar("relatorios", relatorioId, { publicado: !relatorio.publicado });
      renderizarPagina();
    });
    document.getElementById("botao-excluir-relatorio").addEventListener("click", () => {
      if (confirm("Excluir este relatório? Esta ação não pode ser desfeita.")) {
        remover("relatorios", relatorioId);
        window.location.href = "index.html";
      }
    });

    document.getElementById("botao-add-bloco").addEventListener("click", () => abrirModalBloco());
    document.getElementById("modal-fechar").addEventListener("click", fecharModalBloco);
    document.getElementById("modal-cancelar").addEventListener("click", fecharModalBloco);
    document.getElementById("modal-backdrop").addEventListener("click", (e) => { if (e.target.id === "modal-backdrop") fecharModalBloco(); });
    document.getElementById("modal-salvar").addEventListener("click", salvarBloco);
    document.getElementById("modal-excluir-bloco").addEventListener("click", () => {
      const id = document.getElementById("campo-id").value;
      fecharModalBloco();
      if (id) removerBloco(id);
    });

    document.getElementById("area-blocos").addEventListener("click", (e) => {
      const editar = e.target.closest("[data-editar-bloco]");
      if (editar) {
        const bloco = (relatorioAtual().blocos || []).find((b) => b.id === editar.dataset.editarBloco);
        return abrirModalBloco(bloco);
      }
      const remover = e.target.closest("[data-remover-bloco]");
      if (remover) return removerBloco(remover.dataset.removerBloco);
    });
  </script>
</body>
</html>
