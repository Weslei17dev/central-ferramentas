<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Ferramentas — Dados</title>

  <script>
    document.documentElement.dataset.theme = localStorage.getItem("ctf_tema") || "dark";
  </script>

  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
</head>
<body data-module="relatorios-dados">
  <div class="app-shell">
    <div id="app-sidebar"></div>
    <div id="app-header"></div>

    <main class="app-main">
      <div class="page-header">
        <div>
          <h1>Dados</h1>
          <p style="color:var(--muted)">As tabelas do "banco de dados" local, como estão agora — para consulta e para montar relatórios.</p>
        </div>
      </div>

      <div style="display:flex; gap:20px; align-items:flex-start;">
        <div class="card" style="width:240px; flex-shrink:0; padding:10px;">
          <div id="lista-tabelas"></div>
        </div>

        <div style="flex:1; min-width:0;">
          <div class="page-header" style="margin-bottom:14px;">
            <h3 id="titulo-tabela" style="margin:0;">Selecione uma tabela</h3>
            <span class="badge badge--muted" id="contagem-registros"></span>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead><tr id="cabecalho-colunas"></tr></thead>
              <tbody id="corpo-tabela"></tbody>
            </table>
          </div>
          <p style="font-size:11px; color:var(--muted); margin-top:8px;">Mostrando até 50 registros mais recentes. Campos de referência (ex: Cliente) já aparecem pelo nome, não pelo ID.</p>
        </div>
      </div>
    </main>
  </div>

  <script>const CTF_RAIZ = "../";</script>

  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/events.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/db.js"></script>
  <script src="../assets/js/catalogo-relatorios.js"></script>
  <script src="../assets/js/catalogo-menu.js"></script>
  <script src="../assets/js/partials.js"></script>
  <script src="../assets/js/app-shell.js" defer></script>

  <script defer>
    let tabelaSelecionada = null;

    function renderizarListaTabelas() {
      document.getElementById("lista-tabelas").innerHTML = CATALOGO_TABELAS.map((t) => `
        <button class="nav-item ${t.tabela === tabelaSelecionada ? "active" : ""}" data-tabela="${t.tabela}" style="width:100%; text-align:left; margin-bottom:2px;">
          ${t.rotulo} <span class="badge badge--muted" style="margin-left:auto;">${getAll(t.tabela).length}</span>
        </button>`).join("");
    }

    function selecionarTabela(tabela) {
      tabelaSelecionada = tabela;
      renderizarListaTabelas();
      const def = obterTabelaCatalogo(tabela);
      document.getElementById("titulo-tabela").textContent = def.rotulo;

      const registros = getAll(tabela).slice().reverse().slice(0, 50);
      document.getElementById("contagem-registros").textContent = `${getAll(tabela).length} registro(s)`;

      document.getElementById("cabecalho-colunas").innerHTML = def.campos.map((c) => `<th>${c.rotulo}</th>`).join("");

      document.getElementById("corpo-tabela").innerHTML = registros.length
        ? registros.map((r) => `<tr>${def.campos.map((c) => `<td>${resolverValorCampo(r, c) ?? ""}</td>`).join("")}</tr>`).join("")
        : `<tr><td colspan="${def.campos.length}" style="text-align:center; color:var(--muted); padding:24px;">Nenhum registro ainda.</td></tr>`;
    }

    window.addEventListener("ctf:shell-pronto", () => {
      renderizarListaTabelas();
      selecionarTabela(CATALOGO_TABELAS[0].tabela);
    });

    document.getElementById("lista-tabelas").addEventListener("click", (e) => {
      const botao = e.target.closest("[data-tabela]");
      if (botao) selecionarTabela(botao.dataset.tabela);
    });
  </script>
</body>
</html>
