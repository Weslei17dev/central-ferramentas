<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Ferramentas — Configurar Menu</title>

  <script>
    document.documentElement.dataset.theme = localStorage.getItem("ctf_tema") || "dark";
  </script>

  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
</head>
<body data-module="menu">
  <div class="app-shell">
    <div id="app-sidebar"></div>
    <div id="app-header"></div>

    <main class="app-main">
      <div class="page-header">
        <div>
          <h1>Configurar Menu</h1>
          <p style="color:var(--muted)">Crie os grupos que aparecem na sidebar e arraste as ferramentas entre eles.</p>
        </div>
        <div style="display:flex; gap:8px;">
          <input class="input" id="campo-novo-grupo" placeholder="Nome do novo grupo" style="max-width:200px;" />
          <button class="btn btn-primary" id="botao-novo-grupo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
            Novo grupo
          </button>
        </div>
      </div>

      <div class="kanban-board" id="quadro-grupos"></div>
    </main>
  </div>

  <script>const CTF_RAIZ = "../";</script>

  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/events.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/db.js"></script>
  <script src="../assets/js/catalogo-menu.js"></script>
  <script src="../assets/js/partials.js"></script>
  <script src="../assets/js/app-shell.js" defer></script>

  <script defer>
    const SEM_GRUPO = "__sem_grupo__";

    function cardFerramenta(f) {
      return `
        <div class="ferramenta-card" draggable="true" data-chave="${f.chave}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${f.icone}</svg>
          ${f.nome}
        </div>`;
    }

    async function renderizarQuadro() {
      const todosGrupos = await getAll("menuGrupos");
      const grupos = todosGrupos.sort((a, b) => a.ordem - b.ordem);
      const quadro = document.getElementById("quadro-grupos");

      // Busca as ferramentas de cada grupo em paralelo antes de montar o HTML
      // (ferramentasDoGrupo/ferramentasSemGrupo agora são assíncronas).
      const ferramentasPorGrupo = await Promise.all(grupos.map((g) => ferramentasDoGrupo(g.id)));
      const semGrupo = await ferramentasSemGrupo();

      const colunasGrupos = grupos.map((g, i) => `
        <div class="kanban-coluna" data-grupo="${g.id}" style="min-width:240px;">
          <div class="coluna-grupo-header">
            <span contenteditable="true" class="coluna-grupo-nome" data-renomear="${g.id}">${g.nome}</span>
            <div class="coluna-grupo-acoes">
              <button class="icon-btn" data-mover-grupo="${g.id}" data-direcao="-1" title="Mover grupo para a esquerda" ${i === 0 ? "disabled style='opacity:.3'" : ""}>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;"><path d="M15 18l-6-6 6-6"/></svg>
              </button>
              <button class="icon-btn" data-mover-grupo="${g.id}" data-direcao="1" title="Mover grupo para a direita" ${i === grupos.length - 1 ? "disabled style='opacity:.3'" : ""}>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;"><path d="M9 18l6-6-6-6"/></svg>
              </button>
              <button class="icon-btn excluir" data-excluir-grupo="${g.id}" title="Excluir grupo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:13px;height:13px;"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
              </button>
            </div>
          </div>
          <div class="kanban-lista" data-drop-grupo="${g.id}" style="min-height:80px;">
            ${ferramentasPorGrupo[i].map(cardFerramenta).join("")}
          </div>
        </div>`).join("");

      const colunaSemGrupo = `
        <div class="kanban-coluna" data-grupo="${SEM_GRUPO}" style="min-width:240px; background:var(--bg); border-style:dashed;">
          <div class="coluna-grupo-header">
            <span class="coluna-grupo-nome" style="cursor:default;">Sem grupo (não aparece na sidebar)</span>
          </div>
          <div class="kanban-lista" data-drop-grupo="${SEM_GRUPO}" style="min-height:80px;">
            ${semGrupo.map(cardFerramenta).join("")}
          </div>
        </div>`;

      quadro.innerHTML = colunasGrupos + colunaSemGrupo;
      ativarDragAndDrop();
      ativarRenomear();
    }

    function ativarDragAndDrop() {
      document.querySelectorAll(".ferramenta-card").forEach((card) => {
        card.addEventListener("dragstart", (e) => {
          card.classList.add("arrastando");
          e.dataTransfer.setData("text/plain", card.dataset.chave);
        });
        card.addEventListener("dragend", () => card.classList.remove("arrastando"));
      });
      document.querySelectorAll("[data-drop-grupo]").forEach((zona) => {
        zona.addEventListener("dragover", (e) => { e.preventDefault(); zona.closest(".kanban-coluna").classList.add("arrastando-sobre"); });
        zona.addEventListener("dragleave", () => zona.closest(".kanban-coluna").classList.remove("arrastando-sobre"));
        zona.addEventListener("drop", async (e) => {
          e.preventDefault();
          zona.closest(".kanban-coluna").classList.remove("arrastando-sobre");
          const chave = e.dataTransfer.getData("text/plain");
          const grupoId = zona.dataset.dropGrupo === SEM_GRUPO ? null : zona.dataset.dropGrupo;
          await moverFerramentaParaGrupo(chave, grupoId);
          await renderizarQuadro();
        });
      });
    }

    function ativarRenomear() {
      document.querySelectorAll("[data-renomear]").forEach((span) => {
        span.addEventListener("blur", () => {
          const nome = span.textContent.trim();
          if (nome) atualizar("menuGrupos", span.dataset.renomear, { nome });
        });
        span.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); span.blur(); } });
      });
    }

    async function moverGrupo(id, direcao) {
      const todosGrupos = await getAll("menuGrupos");
      const grupos = todosGrupos.sort((a, b) => a.ordem - b.ordem);
      const indice = grupos.findIndex((g) => g.id === id);
      const novoIndice = indice + direcao;
      if (novoIndice < 0 || novoIndice >= grupos.length) return;
      const a = grupos[indice], b = grupos[novoIndice];
      await atualizar("menuGrupos", a.id, { ordem: b.ordem });
      await atualizar("menuGrupos", b.id, { ordem: a.ordem });
      await renderizarQuadro();
    }

    async function excluirGrupo(id) {
      const grupo = await getPorId("menuGrupos", id);
      if (!confirm(`Excluir o grupo "${grupo.nome}"? As ferramentas dele voltam para "Sem grupo" (não somem do sistema).`)) return;
      const atribuicoes = await getAll("menuAtribuicoes");
      await Promise.all(atribuicoes.filter((a) => a.grupoId === id).map((a) => remover("menuAtribuicoes", a.id)));
      await remover("menuGrupos", id);
      await renderizarQuadro();
    }

    window.addEventListener("ctf:shell-pronto", renderizarQuadro);

    document.getElementById("botao-novo-grupo").addEventListener("click", async () => {
      const nome = document.getElementById("campo-novo-grupo").value.trim();
      if (!nome) return;
      const grupos = await getAll("menuGrupos");
      const maiorOrdem = grupos.length ? Math.max(...grupos.map((g) => g.ordem)) : 0;
      await inserir("menuGrupos", { nome, ordem: maiorOrdem + 1 });
      document.getElementById("campo-novo-grupo").value = "";
      await renderizarQuadro();
    });

    document.getElementById("quadro-grupos").addEventListener("click", (e) => {
      const mover = e.target.closest("[data-mover-grupo]");
      if (mover) return moverGrupo(mover.dataset.moverGrupo, Number(mover.dataset.direcao));
      const excluir = e.target.closest("[data-excluir-grupo]");
      if (excluir) return excluirGrupo(excluir.dataset.excluirGrupo);
    });
  </script>
</body>
</html>
