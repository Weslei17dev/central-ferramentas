<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Ferramentas — Clientes</title>

  <!-- Aplica o tema salvo ANTES do CSS carregar, para não haver "flash" -->
  <script>
    document.documentElement.dataset.theme = localStorage.getItem("ctf_tema") || "dark";
  </script>

  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
</head>
<body data-module="crm-clientes">
  <div class="app-shell">
    <div id="app-sidebar"></div>
    <div id="app-header"></div>

    <main class="app-main">
      <div class="page-header">
        <div>
          <h1>Clientes</h1>
          <p style="color:var(--muted)">Cadastro básico — usado por Projetos, Tickets e Financeiro.</p>
        </div>
        <button class="btn btn-primary" id="botao-novo-cliente">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
          Novo cliente
        </button>
      </div>

      <div id="lista-clientes" class="grid-cards"></div>
      <div id="estado-vazio" class="empty-state" hidden>
        <h3>Nenhum cliente encontrado</h3>
        <p>Cadastre o primeiro cliente para começar a vincular projetos a ele.</p>
      </div>
    </main>
  </div>

  <!-- Modal de novo cliente / edição -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-titulo">Novo cliente</h3>
        <button class="icon-btn" id="modal-fechar" aria-label="Fechar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <input type="hidden" id="campo-id" />

      <div class="field">
        <label for="campo-nome">Nome do cliente *</label>
        <input class="input" id="campo-nome" placeholder="Ex: Nexa Varejo" />
      </div>

      <div class="field">
        <label for="campo-contato">Contato</label>
        <input class="input" id="campo-contato" placeholder="E-mail ou telefone" />
      </div>

      <div class="field">
        <label for="campo-tags">Etiquetas</label>
        <input class="input" id="campo-tags" placeholder="Separadas por vírgula. Ex: varejo, prioridade" />
      </div>

      <div class="field">
        <label for="campo-observacoes">Observações</label>
        <textarea class="input" id="campo-observacoes" rows="3" placeholder="Anotações internas sobre o cliente"></textarea>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-cancelar">Cancelar</button>
        <button class="btn btn-primary" id="modal-salvar">Salvar cliente</button>
      </div>
    </div>
  </div>

  <!-- Esta página está UMA PASTA ABAIXO da raiz do projeto -->
  <script>const CTF_RAIZ = "../";</script>

  <!-- Ordem fixa em toda página: utils → events → db → partials → app-shell -->
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/events.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/db.js"></script>
  <script src="../assets/js/catalogo-menu.js"></script>
  <script src="../assets/js/partials.js"></script>
  <script src="../assets/js/app-shell.js" defer></script>

  <!-- Script específico deste módulo -->
  <script defer>
    let filtroAtual = "";
    let favoritosClientes = new Set(); // preenchido em cada renderizarClientes()

    function cardCliente(cliente) {
      const favoritado = favoritosClientes.has(cliente.id);
      const tags = (cliente.tags || [])
        .map((t) => `<span class="badge badge--muted">${t}</span>`)
        .join(" ");

      return `
        <div class="card card-hover" style="border-left:3px solid ${cliente.cor}">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
            <div class="client-tag">
              <span class="client-dot" style="background:${cliente.cor}"></span>
              <strong style="color:var(--ink); font-size:14px;">${cliente.nome}</strong>
            </div>
            <div style="display:flex; gap:2px;">
              <button class="icon-btn favorito ${favoritado ? "ativo" : ""}" data-acao="favoritar" data-id="${cliente.id}" title="Favoritar">
                <svg viewBox="0 0 24 24" fill="${favoritado ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.8"><path d="M12 2l2.9 6.3L21 9l-4.9 4.3L17.5 20 12 16.6 6.5 20l1.4-6.7L3 9l6.1-.7z"/></svg>
              </button>
              <button class="icon-btn" data-acao="editar" data-id="${cliente.id}" title="Editar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
              </button>
              <button class="icon-btn excluir" data-acao="excluir" data-id="${cliente.id}" title="Excluir">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
              </button>
            </div>
          </div>
          <p style="margin-top:8px; color:var(--muted); font-size:13px;">${cliente.contato || "Sem contato cadastrado"}</p>
          ${tags ? `<div style="margin-top:10px; display:flex; gap:6px; flex-wrap:wrap;">${tags}</div>` : ""}
        </div>`;
    }

    async function renderizarClientes() {
      const lista = document.getElementById("lista-clientes");
      const vazio = document.getElementById("estado-vazio");

      // Duas chamadas de rede em paralelo em vez de sequenciais — mais rápido.
      const [todosClientes, favoritos] = await Promise.all([getAll("clientes"), getAll("favoritos")]);
      favoritosClientes = new Set(favoritos.filter((f) => f.tipo === "cliente").map((f) => f.refId));

      const clientes = todosClientes
        .filter((c) => c.nome.toLowerCase().includes(filtroAtual.toLowerCase()))
        .sort((a, b) => a.nome.localeCompare(b.nome));

      if (clientes.length === 0) {
        lista.innerHTML = "";
        vazio.hidden = false;
        return;
      }
      vazio.hidden = true;
      lista.innerHTML = clientes.map(cardCliente).join("");
    }

    function abrirModal(cliente = null) {
      document.getElementById("modal-titulo").textContent = cliente ? "Editar cliente" : "Novo cliente";
      document.getElementById("campo-id").value = cliente?.id || "";
      document.getElementById("campo-nome").value = cliente?.nome || "";
      document.getElementById("campo-contato").value = cliente?.contato || "";
      document.getElementById("campo-tags").value = (cliente?.tags || []).join(", ");
      document.getElementById("campo-observacoes").value = cliente?.observacoes || "";
      document.getElementById("modal-backdrop").hidden = false;
      document.getElementById("campo-nome").focus();
    }

    function fecharModal() {
      document.getElementById("modal-backdrop").hidden = true;
    }

    async function salvarCliente() {
      const id = document.getElementById("campo-id").value;
      const nome = document.getElementById("campo-nome").value.trim();
      if (!nome) {
        document.getElementById("campo-nome").focus();
        return;
      }
      const contato = document.getElementById("campo-contato").value.trim();
      const tags = document
        .getElementById("campo-tags").value.split(",")
        .map((t) => t.trim())
        .filter(Boolean);
      const observacoes = document.getElementById("campo-observacoes").value.trim();

      const botaoSalvar = document.getElementById("modal-salvar");
      botaoSalvar.disabled = true;
      try {
        if (id) {
          await atualizar("clientes", id, { nome, contato, tags, observacoes });
        } else {
          const todos = await getAll("clientes");
          const cor = corParaIndice(todos.length);
          await inserir("clientes", { nome, contato, tags, observacoes, cor });
        }
        fecharModal();
        await renderizarClientes();
      } catch (erro) {
        alert("Não foi possível salvar: " + erro.message);
      } finally {
        botaoSalvar.disabled = false;
      }
    }

    async function excluirCliente(id) {
      const [cliente, projetos] = await Promise.all([getPorId("clientes", id), getAll("projetos")]);
      const usadoEmProjeto = projetos.some((p) => p.clienteId === id);
      if (usadoEmProjeto) {
        alert(`"${cliente.nome}" não pode ser excluído: existe pelo menos um projeto vinculado a ele.`);
        return;
      }
      if (confirm(`Excluir o cliente "${cliente.nome}"? Esta ação não pode ser desfeita.`)) {
        await remover("clientes", id);
        await renderizarClientes();
      }
    }

    window.addEventListener("ctf:shell-pronto", () => {
      renderizarClientes();

      document.getElementById("busca-global")?.addEventListener("input", (e) => {
        filtroAtual = e.target.value;
        renderizarClientes();
      });

      onDadosMudarem("clientes", renderizarClientes);
      onDadosMudarem("favoritos", renderizarClientes);
    });

    document.getElementById("botao-novo-cliente").addEventListener("click", () => abrirModal());
    document.getElementById("modal-fechar").addEventListener("click", fecharModal);
    document.getElementById("modal-cancelar").addEventListener("click", fecharModal);
    document.getElementById("modal-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "modal-backdrop") fecharModal();
    });
    document.getElementById("modal-salvar").addEventListener("click", salvarCliente);

    document.getElementById("lista-clientes").addEventListener("click", async (e) => {
      const botao = e.target.closest("[data-acao]");
      if (!botao) return;
      const id = botao.dataset.id;
      if (botao.dataset.acao === "editar") abrirModal(await getPorId("clientes", id));
      if (botao.dataset.acao === "excluir") await excluirCliente(id);
      if (botao.dataset.acao === "favoritar") {
        await alternarFavorito("cliente", id);
        await renderizarClientes();
      }
    });
  </script>
</body>
</html>
