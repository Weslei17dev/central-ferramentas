<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfólio</title>

  <script>
    document.documentElement.dataset.theme = localStorage.getItem("ctf_tema") || "dark";
  </script>

  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
</head>
<body>
  <div id="pagina" class="portfolio-page"></div>

  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/db.js"></script>

  <script defer>
    function iconeLink(tipo) {
      const icones = {
        github: '<path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.1-.5 2V21"/>',
        linkedin: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 11v5M8 8v.01M12 16v-3a2 2 0 0 1 4 0v3M12 13v3"/>',
        blog: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/>',
      };
      return icones[tipo] || icones.blog;
    }

    function renderizar() {
      const p = getPortfolio();
      const pagina = document.getElementById("pagina");

      if (!p.nome) {
        pagina.innerHTML = `
          <div class="empty-state" style="margin-top:80px;">
            <h3>Portfólio ainda não configurado</h3>
            <p>Preencha os dados no editor interno para esta página ganhar vida.</p>
          </div>`;
        return;
      }

      const links = Object.entries(p.links || {}).filter(([, url]) => url);

      pagina.innerHTML = `
        <div class="portfolio-hero">
          <h1>${p.nome}</h1>
          ${p.cargo ? `<div class="cargo">${p.cargo}</div>` : ""}
          ${p.bio ? `<div class="bio conteudo-artigo">${renderizarMarkdownLite(p.bio)}</div>` : ""}

          ${p.tecnologias?.length ? `<div class="portfolio-tecnologias">${p.tecnologias.map((t) => `<span class="badge badge--accent">${t}</span>`).join("")}</div>` : ""}

          ${links.length ? `<div class="portfolio-links">
            ${links.map(([tipo, url]) => `
              <a class="btn btn-secondary" href="${url}" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:16px;height:16px;">${iconeLink(tipo)}</svg>
                ${tipo === "github" ? "GitHub" : tipo === "linkedin" ? "LinkedIn" : "Blog"}
              </a>`).join("")}
          </div>` : ""}
        </div>

        ${p.experiencias?.length ? `
        <div class="portfolio-secao">
          <h2>Experiência profissional</h2>
          ${p.experiencias.map((e) => `
            <div class="timeline-item">
              <div class="periodo">${e.periodo || ""}</div>
              <h3>${e.cargo || ""}</h3>
              <div class="empresa">${e.empresa || ""}</div>
              ${e.descricao ? `<p style="font-size:13px; color:var(--muted);">${e.descricao}</p>` : ""}
            </div>`).join("")}
        </div>` : ""}

        ${p.projetosDestaque?.length ? `
        <div class="portfolio-secao">
          <h2>Projetos em destaque</h2>
          <div class="grid-cards">
            ${p.projetosDestaque.map((pr) => `
              <div class="card">
                <strong style="font-size:14px;">${pr.nome || ""}</strong>
                ${pr.descricao ? `<p style="font-size:13px; color:var(--muted); margin-top:6px;">${pr.descricao}</p>` : ""}
                ${pr.link ? `<a href="${pr.link}" target="_blank" rel="noopener" style="font-size:12px; color:var(--accent); display:block; margin-top:8px;">${pr.link}</a>` : ""}
              </div>`).join("")}
          </div>
        </div>` : ""}

        ${p.certificados?.length ? `
        <div class="portfolio-secao">
          <h2>Certificados</h2>
          <div class="grid-cards">
            ${p.certificados.map((c) => `
              <div class="card">
                <strong style="font-size:13px;">${c.nome || ""}</strong>
                <p style="font-size:12px; color:var(--muted); margin-top:4px;">${c.instituicao || ""}${c.ano ? " • " + c.ano : ""}</p>
              </div>`).join("")}
          </div>
        </div>` : ""}
      `;
    }

    renderizar();
    window.addEventListener("storage", (e) => { if (e.key === "ctf_portfolio") renderizar(); });
  </script>
</body>
</html>
