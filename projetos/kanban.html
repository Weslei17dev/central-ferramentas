<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Ferramentas — Kanban</title>

  <script>
    document.documentElement.dataset.theme = localStorage.getItem("ctf_tema") || "dark";
  </script>

  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
</head>
<body data-module="projetos">
  <div class="app-shell">
    <div id="app-sidebar"></div>
    <div id="app-header"></div>

    <main class="app-main">
      <a href="index.html" class="btn btn-ghost" style="padding-left:0; margin-bottom:8px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg>
        Voltar para Projetos
      </a>

      <div class="page-header">
        <div>
          <h1 id="titulo-projeto">Carregando…</h1>
          <div id="cliente-do-projeto" class="client-tag"></div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-secondary" id="botao-colunas">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
            Personalizar colunas
          </button>
        </div>
      </div>

      <div style="display:flex; gap:8px; margin-bottom:18px;">
        <a class="btn btn-primary" href="#" id="tab-kanban" style="pointer-events:none;">Kanban</a>
        <a class="btn btn-secondary" id="tab-lista">Lista</a>
      </div>

      <div id="quadro" class="kanban-board"></div>
    </main>
  </div>

  <!-- Modal de nova tarefa / edição (abas) -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal modal--largo">
      <div class="modal-header">
        <h3 id="modal-titulo">Nova tarefa</h3>
        <button class="icon-btn" id="modal-fechar" aria-label="Fechar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div style="display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:14px;">
        <button class="btn btn-ghost" data-aba="geral" style="border-radius:0; border-bottom:2px solid var(--accent);">Geral</button>
        <button class="btn btn-ghost" data-aba="descricao" style="border-radius:0;">Descrição</button>
        <button class="btn btn-ghost" data-aba="checklist" id="aba-btn-checklist" style="border-radius:0; display:none;">Checklist</button>
        <button class="btn btn-ghost" data-aba="comentarios" id="aba-btn-comentarios" style="border-radius:0; display:none;">Comentários</button>
      </div>

      <input type="hidden" id="campo-id" />
      <input type="hidden" id="campo-coluna" />

      <div class="conteudo-aba" data-conteudo="geral">
        <div class="field">
          <label for="campo-titulo">Título da tarefa *</label>
          <input class="input" id="campo-titulo" placeholder="Ex: Wireframe da home" />
        </div>
        <div style="display:flex; gap:10px;">
          <div class="field" style="flex:1;">
            <label for="campo-responsavel">Responsável</label>
            <select class="input" id="campo-responsavel"><option value="">Nenhum</option></select>
          </div>
          <div class="field" style="flex:1;">
            <label for="campo-prioridade">Prioridade</label>
            <select class="input" id="campo-prioridade">
              <option value="baixa">Baixa</option>
              <option value="media" selected>Média</option>
              <option value="alta">Alta</option>
            </select>
          </div>
        </div>
        <div style="display:flex; gap:10px;">
          <div class="field" style="flex:1;">
            <label for="campo-status">Status</label>
            <select class="input" id="campo-status"></select>
          </div>
          <div class="field" style="flex:1;">
            <label for="campo-prazo">Prazo</label>
            <input class="input" type="date" id="campo-prazo" />
          </div>
        </div>
        <div class="field">
          <label for="campo-bloqueada">Bloqueada por (dependência)</label>
          <select class="input" id="campo-bloqueada"><option value="">Nenhuma dependência</option></select>
        </div>
        <div class="field">
          <label for="campo-tags">Tags</label>
          <input class="input" id="campo-tags" placeholder="Separadas por vírgula" />
        </div>
      </div>

      <div class="conteudo-aba" data-conteudo="descricao" hidden>
        <div class="field">
          <label for="campo-descricao">Descrição</label>
          <textarea class="input" id="campo-descricao" rows="6" placeholder="Detalhes da tarefa"></textarea>
        </div>
      </div>

      <div class="conteudo-aba" data-conteudo="checklist" hidden>
        <div style="display:flex; gap:6px; margin-bottom:12px;">
          <input class="input" id="novo-subitem" placeholder="Nova subtarefa..." style="flex:1;" />
          <button class="btn btn-secondary" id="add-subitem">Adicionar</button>
        </div>
        <div id="lista-checklist"></div>
      </div>

      <div class="conteudo-aba" data-conteudo="comentarios" hidden>
        <div id="lista-comentarios" style="max-height:200px; overflow-y:auto; margin-bottom:10px;"></div>
        <textarea class="input" id="novo-comentario" rows="2" placeholder="Escreva um comentário..."></textarea>
        <button class="btn btn-secondary" id="add-comentario" style="margin-top:8px;">Comentar</button>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-excluir" style="margin-right:auto; color:var(--danger); display:none;">Excluir tarefa</button>
        <button class="btn btn-secondary" id="modal-cancelar">Cancelar</button>
        <button class="btn btn-primary" id="modal-salvar">Salvar tarefa</button>
      </div>
    </div>
  </div>

  <!-- Modal: gerenciar colunas -->
  <div class="modal-backdrop" id="modal-backdrop-colunas" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3>Personalizar colunas</h3>
        <button class="icon-btn" id="colunas-fechar" aria-label="Fechar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="lista-colunas-mgmt" style="margin-bottom:14px;"></div>
      <div style="display:flex; gap:6px;">
        <input class="input" id="nova-coluna" placeholder="Nome da nova coluna" style="flex:1;" />
        <button class="btn btn-primary" id="add-coluna">Adicionar</button>
      </div>
      <p style="font-size:11px; color:var(--muted); margin-top:12px;">Colunas valem para o Kanban de todos os projetos. Remover uma coluna com tarefas move essas tarefas para a primeira coluna.</p>
    </div>
  </div>

  <script>const CTF_RAIZ = "../";</script>

  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/events.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/db.js"></script>
  <script src="../assets/js/catalogo-menu.js"></script>
  <script src="../assets/js/partials.js"></script>
  <script src="../assets/js/app-shell.js" defer></script>

  <script defer>
    const projetoId = new URLSearchParams(window.location.search).get("projeto");
    let tarefaAbertaId = null;

    function colunas() { return getAll("kanbanColunas"); }
    function primeiraColuna() { return colunas()[0]; }
    function ultimaColuna() { return colunas()[colunas().length - 1]; }

    function proximoCodigo() {
      const tarefas = getAll("tarefas").filter((t) => t.projetoId === projetoId);
      return `T-${tarefas.length + 1}`;
    }

    function badgePrioridade(prioridade) {
      const mapa = { alta: "badge--accent", media: "badge--warning", baixa: "badge--muted" };
      const label = { alta: "Alta", media: "Média", baixa: "Baixa" };
      return `<span class="badge ${mapa[prioridade] || "badge--muted"}">${label[prioridade] || prioridade}</span>`;
    }

    function tarefaBloqueadaAtiva(tarefa) {
      if (!tarefa.bloqueadaPor) return null;
      const bloqueadora = getPorId("tarefas", tarefa.bloqueadaPor);
      if (!bloqueadora) return null;
      return bloqueadora.coluna !== ultimaColuna().id ? bloqueadora : null;
    }

    function cardTarefa(tarefa, corCliente, indiceColuna, listaColunas) {
      const responsavel = tarefa.responsavelId ? getPorId("equipe", tarefa.responsavelId) : null;
      const podeVoltar = indiceColuna > 0;
      const podeAvancar = indiceColuna < listaColunas.length - 1;
      const bloqueadora = tarefaBloqueadaAtiva(tarefa);
      const checklist = tarefa.subtarefas || [];
      const feitos = checklist.filter((s) => s.concluida).length;
      const comentarios = tarefa.comentarios || [];
      const tags = (tarefa.tags || []).map((t) => `<span class="badge badge--muted">${t}</span>`).join(" ");

      return `
        <div class="task-card" style="border-left-color:${corCliente}" draggable="true" data-id="${tarefa.id}">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <span class="badge badge--muted" style="font-family:var(--font-mono);">${tarefa.codigo || ""}</span>
          </div>
          ${bloqueadora ? `<div class="badge badge--accent" style="margin-bottom:6px;" title="Bloqueada por ${bloqueadora.codigo}">🔒 Bloqueada por ${bloqueadora.codigo}</div>` : ""}
          ${tags ? `<div style="margin-bottom:6px; display:flex; flex-wrap:wrap; gap:4px;">${tags}</div>` : ""}
          <div class="task-card-titulo">${tarefa.titulo}</div>
          <div class="task-card-meta">
            <div style="display:flex; align-items:center; gap:6px;">
              ${badgePrioridade(tarefa.prioridade)}
              ${tarefa.prazo ? `<span style="font-size:11px; color:var(--muted);">${formatarData(tarefa.prazo)}</span>` : ""}
            </div>
            ${responsavel ? `<div class="avatar" style="width:22px;height:22px;font-size:10px;" title="${responsavel.nome}">${iniciais(responsavel.nome)}</div>` : ""}
          </div>
          ${checklist.length || comentarios.length ? `<div style="display:flex; gap:10px; font-size:11px; color:var(--muted); margin-top:6px;">
            ${checklist.length ? `<span>☑ ${feitos}/${checklist.length}</span>` : ""}
            ${comentarios.length ? `<span>💬 ${comentarios.length}</span>` : ""}
          </div>` : ""}
          <div class="task-card-mover">
            <button class="icon-btn" data-mover="${tarefa.id}" data-direcao="-1" ${podeVoltar ? "" : "disabled style='opacity:.3'"} title="Mover para trás">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <button class="icon-btn" data-editar="${tarefa.id}" title="Editar tarefa" style="flex:1;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            </button>
            <button class="icon-btn" data-mover="${tarefa.id}" data-direcao="1" ${podeAvancar ? "" : "disabled style='opacity:.3'"} title="Mover para frente">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
        </div>`;
    }

    function renderizarQuadro() {
      const projeto = getPorId("projetos", projetoId);
      if (!projeto) {
        document.getElementById("quadro").innerHTML = '<div class="empty-state">Projeto não encontrado. <a href="index.html">Voltar</a></div>';
        return;
      }
      const cliente = getPorId("clientes", projeto.clienteId);
      const cor = cliente?.cor || "var(--muted)";

      document.getElementById("titulo-projeto").textContent = projeto.nome;
      document.getElementById("cliente-do-projeto").innerHTML = `<span class="client-dot" style="background:${cor}"></span> ${cliente?.nome || "Cliente removido"}`;
      document.getElementById("tab-lista").href = `lista.html?projeto=${projetoId}`;

      const listaColunas = colunas();
      const tarefas = getAll("tarefas").filter((t) => t.projetoId === projetoId);

      document.getElementById("quadro").innerHTML = listaColunas.map((coluna, indice) => {
        const tarefasDaColuna = tarefas.filter((t) => t.coluna === coluna.id);
        return `
          <div class="kanban-coluna" data-coluna="${coluna.id}">
            <div class="kanban-coluna-header">
              <span class="kanban-coluna-titulo">${coluna.label} <span class="badge badge--muted">${tarefasDaColuna.length}</span></span>
              <button class="icon-btn" data-nova-em="${coluna.id}" title="Adicionar tarefa">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
              </button>
            </div>
            <div class="kanban-lista" data-coluna="${coluna.id}">
              ${tarefasDaColuna.map((t) => cardTarefa(t, cor, indice, listaColunas)).join("")}
            </div>
          </div>`;
      }).join("");

      ativarDragAndDrop();
    }

    function ativarDragAndDrop() {
      document.querySelectorAll(".task-card").forEach((card) => {
        card.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", card.dataset.id));
      });
      document.querySelectorAll(".kanban-coluna").forEach((colunaEl) => {
        colunaEl.addEventListener("dragover", (e) => { e.preventDefault(); colunaEl.classList.add("arrastando-sobre"); });
        colunaEl.addEventListener("dragleave", () => colunaEl.classList.remove("arrastando-sobre"));
        colunaEl.addEventListener("drop", (e) => {
          e.preventDefault();
          colunaEl.classList.remove("arrastando-sobre");
          const id = e.dataTransfer.getData("text/plain");
          moverParaColuna(id, colunaEl.dataset.coluna);
        });
      });
    }

    function moverParaColuna(id, novaColunaId) {
      const tarefa = getPorId("tarefas", id);
      if (novaColunaId !== primeiraColuna().id) {
        const bloqueadora = tarefaBloqueadaAtiva(tarefa);
        if (bloqueadora) { alert(`Esta tarefa está bloqueada por "${bloqueadora.titulo}" (${bloqueadora.codigo}). Conclua-a primeiro.`); return; }
      }
      const colunaAntiga = colunas().find((c) => c.id === tarefa.coluna);
      const colunaNova = colunas().find((c) => c.id === novaColunaId);
      atualizar("tarefas", id, { coluna: novaColunaId });
      registrarLog("projetos", `Tarefa [${tarefa.codigo}] movida de "${colunaAntiga?.label}" para "${colunaNova?.label}".`);
      renderizarQuadro();
    }

    function moverTarefa(id, direcao) {
      const listaColunas = colunas();
      const tarefa = getPorId("tarefas", id);
      const indiceAtual = listaColunas.findIndex((c) => c.id === tarefa.coluna);
      const novoIndice = indiceAtual + direcao;
      if (novoIndice < 0 || novoIndice >= listaColunas.length) return;
      moverParaColuna(id, listaColunas[novoIndice].id);
    }

    /* ---------- Abas do modal de tarefa ---------- */
    function trocarAba(aba) {
      document.querySelectorAll("[data-aba]").forEach((btn) => btn.style.borderBottom = btn.dataset.aba === aba ? "2px solid var(--accent)" : "2px solid transparent");
      document.querySelectorAll(".conteudo-aba").forEach((c) => c.hidden = c.dataset.conteudo !== aba);
    }
    document.querySelectorAll("[data-aba]").forEach((btn) => btn.addEventListener("click", () => trocarAba(btn.dataset.aba)));

    function popularSelectsModal(tarefaAtual) {
      document.getElementById("campo-responsavel").innerHTML =
        '<option value="">Nenhum</option>' + getAll("equipe").sort((a, b) => a.nome.localeCompare(b.nome))
          .map((m) => `<option value="${m.id}" ${m.id === tarefaAtual?.responsavelId ? "selected" : ""}>${m.nome}</option>`).join("");

      document.getElementById("campo-status").innerHTML = colunas()
        .map((c) => `<option value="${c.id}">${c.label}</option>`).join("");

      const outras = getAll("tarefas").filter((t) => t.projetoId === projetoId && t.id !== tarefaAtual?.id);
      document.getElementById("campo-bloqueada").innerHTML =
        '<option value="">Nenhuma dependência</option>' + outras
          .map((t) => `<option value="${t.id}" ${t.id === tarefaAtual?.bloqueadaPor ? "selected" : ""}>${t.codigo} — ${t.titulo}</option>`).join("");
    }

    function abrirModalNova(colunaId) {
      tarefaAbertaId = null;
      document.getElementById("modal-titulo").textContent = "Nova tarefa";
      document.getElementById("modal-excluir").style.display = "none";
      document.getElementById("aba-btn-checklist").style.display = "none";
      document.getElementById("aba-btn-comentarios").style.display = "none";
      popularSelectsModal(null);
      document.getElementById("campo-id").value = "";
      document.getElementById("campo-coluna").value = colunaId;
      document.getElementById("campo-titulo").value = "";
      document.getElementById("campo-responsavel").value = "";
      document.getElementById("campo-prioridade").value = "media";
      document.getElementById("campo-status").value = colunaId;
      document.getElementById("campo-prazo").value = "";
      document.getElementById("campo-bloqueada").value = "";
      document.getElementById("campo-tags").value = "";
      document.getElementById("campo-descricao").value = "";
      trocarAba("geral");
      document.getElementById("modal-backdrop").hidden = false;
      document.getElementById("campo-titulo").focus();
    }

    function abrirModalEditar(id) {
      const tarefa = getPorId("tarefas", id);
      tarefaAbertaId = id;
      document.getElementById("modal-titulo").textContent = tarefa.codigo;
      document.getElementById("modal-excluir").style.display = "inline-flex";
      document.getElementById("aba-btn-checklist").style.display = "inline-flex";
      document.getElementById("aba-btn-comentarios").style.display = "inline-flex";
      popularSelectsModal(tarefa);
      document.getElementById("campo-id").value = tarefa.id;
      document.getElementById("campo-coluna").value = tarefa.coluna;
      document.getElementById("campo-titulo").value = tarefa.titulo;
      document.getElementById("campo-responsavel").value = tarefa.responsavelId || "";
      document.getElementById("campo-prioridade").value = tarefa.prioridade;
      document.getElementById("campo-status").value = tarefa.coluna;
      document.getElementById("campo-prazo").value = tarefa.prazo || "";
      document.getElementById("campo-bloqueada").value = tarefa.bloqueadaPor || "";
      document.getElementById("campo-tags").value = (tarefa.tags || []).join(", ");
      document.getElementById("campo-descricao").value = tarefa.descricao || "";
      renderizarChecklist();
      renderizarComentarios();
      trocarAba("geral");
      document.getElementById("modal-backdrop").hidden = false;
    }

    function fecharModal() { document.getElementById("modal-backdrop").hidden = true; tarefaAbertaId = null; }

    function salvarTarefa() {
      const id = document.getElementById("campo-id").value;
      const titulo = document.getElementById("campo-titulo").value.trim();
      if (!titulo) { trocarAba("geral"); document.getElementById("campo-titulo").focus(); return; }
      const dados = {
        titulo,
        responsavelId: document.getElementById("campo-responsavel").value || null,
        prioridade: document.getElementById("campo-prioridade").value,
        coluna: document.getElementById("campo-status").value,
        prazo: document.getElementById("campo-prazo").value,
        bloqueadaPor: document.getElementById("campo-bloqueada").value || null,
        tags: document.getElementById("campo-tags").value.split(",").map((t) => t.trim()).filter(Boolean),
        descricao: document.getElementById("campo-descricao").value,
        projetoId,
      };
      if (id) {
        atualizar("tarefas", id, dados);
        registrarLog("projetos", `Tarefa [${getPorId("tarefas", id).codigo}] editada.`);
      } else {
        const nova = inserir("tarefas", { ...dados, codigo: proximoCodigo(), subtarefas: [], comentarios: [] });
        registrarLog("projetos", `Tarefa [${nova.codigo}] criada: ${titulo}`);
      }
      fecharModal();
      renderizarQuadro();
    }

    /* ---------- Checklist ---------- */
    function renderizarChecklist() {
      const tarefa = getPorId("tarefas", tarefaAbertaId);
      const itens = tarefa.subtarefas || [];
      document.getElementById("lista-checklist").innerHTML = itens.length ? itens.map((s, i) => `
        <div style="display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--border);">
          <input type="checkbox" data-toggle-sub="${i}" ${s.concluida ? "checked" : ""} />
          <span style="flex:1; font-size:13px; ${s.concluida ? "text-decoration:line-through; color:var(--muted);" : ""}">${s.titulo}</span>
          <button class="icon-btn" data-del-sub="${i}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:14px;height:14px;"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>`).join("") : '<p style="color:var(--muted); font-size:13px;">Nenhuma subtarefa ainda.</p>';
    }
    document.getElementById("add-subitem").addEventListener("click", () => {
      const texto = document.getElementById("novo-subitem").value.trim();
      if (!texto || !tarefaAbertaId) return;
      const tarefa = getPorId("tarefas", tarefaAbertaId);
      const subtarefas = [...(tarefa.subtarefas || []), { titulo: texto, concluida: false }];
      atualizar("tarefas", tarefaAbertaId, { subtarefas });
      document.getElementById("novo-subitem").value = "";
      renderizarChecklist();
    });
    document.getElementById("lista-checklist").addEventListener("click", (e) => {
      const toggle = e.target.closest("[data-toggle-sub]");
      const del = e.target.closest("[data-del-sub]");
      if (!toggle && !del) return;
      const tarefa = getPorId("tarefas", tarefaAbertaId);
      const subtarefas = [...(tarefa.subtarefas || [])];
      const indice = Number((toggle || del).dataset.toggleSub ?? (toggle || del).dataset.delSub);
      if (toggle) subtarefas[indice].concluida = !subtarefas[indice].concluida;
      if (del) subtarefas.splice(indice, 1);
      atualizar("tarefas", tarefaAbertaId, { subtarefas });
      renderizarChecklist();
    });

    /* ---------- Comentários ---------- */
    function renderizarComentarios() {
      const tarefa = getPorId("tarefas", tarefaAbertaId);
      const comentarios = tarefa.comentarios || [];
      document.getElementById("lista-comentarios").innerHTML = comentarios.length ? comentarios.map((c) => `
        <div style="padding:8px 0; border-bottom:1px solid var(--border);">
          <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--muted);"><strong style="color:var(--ink);">${c.autor || "Você"}</strong><span>${formatarData(c.data)}</span></div>
          <p style="font-size:13px; margin-top:2px;">${c.texto}</p>
        </div>`).join("") : '<p style="color:var(--muted); font-size:13px;">Nenhum comentário ainda.</p>';
    }
    document.getElementById("add-comentario").addEventListener("click", () => {
      const texto = document.getElementById("novo-comentario").value.trim();
      if (!texto || !tarefaAbertaId) return;
      const tarefa = getPorId("tarefas", tarefaAbertaId);
      const comentarios = [...(tarefa.comentarios || []), { autor: "Você", texto, data: new Date().toISOString() }];
      atualizar("tarefas", tarefaAbertaId, { comentarios });
      document.getElementById("novo-comentario").value = "";
      renderizarComentarios();
      renderizarQuadro();
    });

    /* ---------- Gerenciar colunas ---------- */
    function renderizarColunasMgmt() {
      const lista = colunas();
      document.getElementById("lista-colunas-mgmt").innerHTML = lista.map((c, i) => `
        <div style="display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 12px; margin-bottom:6px;">
          <span style="flex:1; font-size:13px;">${c.label}</span>
          <button class="icon-btn excluir" data-remover-coluna="${i}" ${lista.length <= 1 ? "disabled style='opacity:.3'" : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:14px;height:14px;"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg></button>
        </div>`).join("");
    }
    document.getElementById("botao-colunas").addEventListener("click", () => { renderizarColunasMgmt(); document.getElementById("modal-backdrop-colunas").hidden = false; });
    document.getElementById("colunas-fechar").addEventListener("click", () => document.getElementById("modal-backdrop-colunas").hidden = true);
    document.getElementById("modal-backdrop-colunas").addEventListener("click", (e) => { if (e.target.id === "modal-backdrop-colunas") document.getElementById("modal-backdrop-colunas").hidden = true; });

    document.getElementById("add-coluna").addEventListener("click", () => {
      const label = document.getElementById("nova-coluna").value.trim();
      if (!label) return;
      const lista = colunas();
      lista.push({ id: gerarId(), label });
      saveAll("kanbanColunas", lista);
      registrarLog("projetos", `Coluna "${label}" adicionada ao Kanban.`);
      document.getElementById("nova-coluna").value = "";
      renderizarColunasMgmt();
      renderizarQuadro();
    });
    document.getElementById("lista-colunas-mgmt").addEventListener("click", (e) => {
      const botao = e.target.closest("[data-remover-coluna]");
      if (!botao) return;
      const lista = colunas();
      if (lista.length <= 1) return;
      const indice = Number(botao.dataset.removerColuna);
      const removida = lista[indice];
      if (!confirm(`Remover a coluna "${removida.label}"? Tarefas nela vão para "${lista[0].id === removida.id ? lista[1].label : lista[0].label}".`)) return;
      lista.splice(indice, 1);
      saveAll("kanbanColunas", lista);
      const tarefas = getAll("tarefas").map((t) => t.coluna === removida.id ? { ...t, coluna: lista[0].id } : t);
      saveAll("tarefas", tarefas);
      registrarLog("projetos", `Coluna "${removida.label}" removida do Kanban.`);
      renderizarColunasMgmt();
      renderizarQuadro();
    });

    window.addEventListener("ctf:shell-pronto", () => {
      renderizarQuadro();
      onDadosMudarem("tarefas", renderizarQuadro);
      onDadosMudarem("projetos", renderizarQuadro);
      onDadosMudarem("equipe", renderizarQuadro);
    });

    document.getElementById("modal-fechar").addEventListener("click", fecharModal);
    document.getElementById("modal-cancelar").addEventListener("click", fecharModal);
    document.getElementById("modal-backdrop").addEventListener("click", (e) => { if (e.target.id === "modal-backdrop") fecharModal(); });
    document.getElementById("modal-salvar").addEventListener("click", salvarTarefa);
    document.getElementById("modal-excluir").addEventListener("click", () => {
      const id = document.getElementById("campo-id").value;
      if (id && confirm("Excluir esta tarefa? Tarefas que dependem dela perdem a dependência.")) {
        const tarefa = getPorId("tarefas", id);
        getAll("tarefas").filter((t) => t.bloqueadaPor === id).forEach((t) => atualizar("tarefas", t.id, { bloqueadaPor: null }));
        remover("tarefas", id);
        registrarLog("projetos", `Tarefa [${tarefa.codigo}] excluída: ${tarefa.titulo}`);
        fecharModal();
        renderizarQuadro();
      }
    });

    document.getElementById("quadro").addEventListener("click", (e) => {
      const botaoNova = e.target.closest("[data-nova-em]");
      if (botaoNova) return abrirModalNova(botaoNova.dataset.novaEm);
      const botaoEditar = e.target.closest("[data-editar]");
      if (botaoEditar) return abrirModalEditar(botaoEditar.dataset.editar);
      const botaoMover = e.target.closest("[data-mover]");
      if (botaoMover) return moverTarefa(botaoMover.dataset.mover, Number(botaoMover.dataset.direcao));
    });
  </script>
</body>
</html>
