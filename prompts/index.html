<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Ferramentas — Prompts</title>

  <script>
    document.documentElement.dataset.theme = localStorage.getItem("ctf_tema") || "dark";
  </script>

  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
</head>
<body data-module="prompts">
  <div class="app-shell">
    <div id="app-sidebar"></div>
    <div id="app-header"></div>

    <main class="app-main">
      <div class="page-header">
        <div>
          <h1>Prompts</h1>
          <p style="color:var(--muted)">Biblioteca pessoal de prompts de IA.</p>
        </div>
        <button class="btn btn-primary" id="botao-novo-prompt">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
          Novo prompt
        </button>
      </div>

      <div id="secao-historico" style="margin-bottom:18px;">
        <div class="subsection-title" style="margin-top:0;">Usados recentemente</div>
        <div id="lista-historico" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
      </div>

      <div style="margin-bottom:18px;">
        <select class="input" id="filtro-categoria" style="max-width:220px;">
          <option value="">Todas as categorias</option>
        </select>
      </div>

      <div id="lista-prompts" class="grid-cards"></div>
      <div id="estado-vazio" class="empty-state" hidden>
        <h3>Nenhum prompt encontrado</h3>
        <p>Cadastre o primeiro prompt da sua biblioteca.</p>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal modal--largo">
      <div class="modal-header">
        <h3 id="modal-titulo">Novo prompt</h3>
        <button class="icon-btn" id="modal-fechar" aria-label="Fechar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <input type="hidden" id="campo-id" />

      <div class="field">
        <label for="campo-titulo-form">Título *</label>
        <input class="input" id="campo-titulo-form" placeholder="Ex: Gerar descrição de produto para e-commerce" />
      </div>

      <div style="display:flex; gap:10px;">
        <div class="field" style="flex:1;">
          <label for="campo-categoria-form">Categoria</label>
          <select class="input" id="campo-categoria-form"></select>
        </div>
        <div class="field" style="flex:1;">
          <label for="campo-tags">Tags</label>
          <input class="input" id="campo-tags" placeholder="Separadas por vírgula" />
        </div>
      </div>

      <div class="field">
        <label for="campo-conteudo">Prompt *</label>
        <textarea class="input code-editor" id="campo-conteudo" placeholder="Escreva o texto do prompt aqui"></textarea>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-excluir" style="margin-right:auto; color:var(--danger); display:none;">Excluir</button>
        <button class="btn btn-secondary" id="modal-cancelar">Cancelar</button>
        <button class="btn btn-primary" id="modal-salvar">Salvar prompt</button>
      </div>
    </div>
  </div>

  <script>const CTF_RAIZ = "../";</script>

  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/events.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/db.js"></script>
  <script src="../assets/js/catalogo-menu.js"></script>
  <script src="../assets/js/partials.js"></script>
  <script src="../assets/js/app-shell.js" defer></script>

  <script defer>
    let filtroTexto = "";

    function popularSelectsCategoria(categoriaSelecionada) {
      const categorias = getCategorias("prompt");
      document.getElementById("filtro-categoria").innerHTML =
        '<option value="">Todas as categorias</option>' + categorias.map((c) => `<option value="${c.nome}">${c.nome}</option>`).join("");
      document.getElementById("campo-categoria-form").innerHTML =
        categorias.map((c) => `<option value="${c.nome}" ${c.nome === categoriaSelecionada ? "selected" : ""}>${c.nome}</option>`).join("");
    }

    function ehFavorito(id) {
      return getAll("favoritos").some((f) => f.tipo === "prompt" && f.refId === id);
    }

    function renderizarHistorico() {
      const usados = getAll("prompts")
        .filter((p) => p.ultimoUso)
        .sort((a, b) => b.ultimoUso.localeCompare(a.ultimoUso))
        .slice(0, 5);

      const container = document.getElementById("secao-historico");
      const lista = document.getElementById("lista-historico");
      if (usados.length === 0) { container.hidden = true; return; }
      container.hidden = false;
      lista.innerHTML = usados
        .map((p) => `<button class="btn btn-secondary" style="height:30px; font-size:12px;" data-usar-rapido="${p.id}">${p.titulo}</button>`)
        .join("");
    }

    function cardPrompt(prompt) {
      const tags = (prompt.tags || []).map((t) => `<span class="badge badge--muted">${t}</span>`).join("");
      return `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
            <div>
              <strong style="color:var(--ink); font-size:14px;">${prompt.titulo}</strong>
              <div><span class="badge badge--accent">${prompt.categoria}</span></div>
            </div>
            <div style="display:flex; gap:2px;">
              <button class="icon-btn favorito ${ehFavorito(prompt.id) ? "ativo" : ""}" data-acao="favoritar" data-id="${prompt.id}" title="Favoritar">
                <svg viewBox="0 0 24 24" fill="${ehFavorito(prompt.id) ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.8"><path d="M12 2l2.9 6.3L21 9l-4.9 4.3L17.5 20 12 16.6 6.5 20l1.4-6.7L3 9l6.1-.7z"/></svg>
              </button>
              <button class="icon-btn" data-acao="editar" data-id="${prompt.id}" title="Editar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
              </button>
              <button class="icon-btn excluir" data-acao="excluir" data-id="${prompt.id}" title="Excluir">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
              </button>
            </div>
          </div>

          <div class="prompt-block" style="margin-top:10px;">${escaparHTML(prompt.conteudo)}</div>

          ${tags ? `<div class="arquivo-tags" style="margin-top:8px;">${tags}</div>` : ""}
          ${prompt.ultimoUso ? `<p style="font-size:11px; color:var(--muted); margin-top:6px;">Usado pela última vez em ${formatarData(prompt.ultimoUso)}</p>` : ""}

          <button class="btn btn-secondary" style="width:100%; margin-top:10px;" data-acao="usar" data-id="${prompt.id}">
            Copiar prompt
          </button>
        </div>`;
    }

    function renderizarPrompts() {
      const filtroCategoria = document.getElementById("filtro-categoria").value;
      const prompts = getAll("prompts")
        .filter((p) => (p.titulo + " " + (p.tags || []).join(" ")).toLowerCase().includes(filtroTexto.toLowerCase()))
        .filter((p) => !filtroCategoria || p.categoria === filtroCategoria)
        .sort((a, b) => a.titulo.localeCompare(b.titulo));

      const lista = document.getElementById("lista-prompts");
      const vazio = document.getElementById("estado-vazio");
      lista.innerHTML = prompts.map(cardPrompt).join("");
      vazio.hidden = prompts.length !== 0;
      renderizarHistorico();
    }

    function abrirModal(prompt = null) {
      popularSelectsCategoria(prompt?.categoria);
      document.getElementById("modal-titulo").textContent = prompt ? "Editar prompt" : "Novo prompt";
      document.getElementById("modal-excluir").style.display = prompt ? "inline-flex" : "none";
      document.getElementById("campo-id").value = prompt?.id || "";
      document.getElementById("campo-titulo-form").value = prompt?.titulo || "";
      document.getElementById("campo-categoria-form").value = prompt?.categoria || "";
      document.getElementById("campo-tags").value = (prompt?.tags || []).join(", ");
      document.getElementById("campo-conteudo").value = prompt?.conteudo || "";
      document.getElementById("modal-backdrop").hidden = false;
      document.getElementById("campo-titulo-form").focus();
    }
    function fecharModal() { document.getElementById("modal-backdrop").hidden = true; }

    function salvarPrompt() {
      const id = document.getElementById("campo-id").value;
      const titulo = document.getElementById("campo-titulo-form").value.trim();
      const conteudo = document.getElementById("campo-conteudo").value;
      if (!titulo || !conteudo.trim()) {
        document.getElementById(!titulo ? "campo-titulo-form" : "campo-conteudo").focus();
        return;
      }
      const dados = {
        titulo,
        categoria: document.getElementById("campo-categoria-form").value,
        tags: document.getElementById("campo-tags").value.split(",").map((t) => t.trim()).filter(Boolean),
        conteudo,
      };
      if (id) atualizar("prompts", id, dados);
      else inserir("prompts", dados);
      fecharModal();
      renderizarPrompts();
    }

    function excluirPrompt(id) {
      const prompt = getPorId("prompts", id);
      if (confirm(`Excluir o prompt "${prompt.titulo}"?`)) {
        remover("prompts", id);
        renderizarPrompts();
      }
    }

    function usarPrompt(id, botao) {
      const prompt = getPorId("prompts", id);
      navigator.clipboard.writeText(prompt.conteudo).then(() => {
        atualizar("prompts", id, { ultimoUso: new Date().toISOString() });
        renderizarPrompts();
        if (botao) {
          const textoOriginal = botao.textContent;
          botao.textContent = "Copiado!";
          setTimeout(() => { if (document.body.contains(botao)) botao.textContent = textoOriginal; }, 1200);
        }
      });
    }

    window.addEventListener("ctf:shell-pronto", () => {
      popularSelectsCategoria();
      renderizarPrompts();
      document.getElementById("busca-global")?.addEventListener("input", (e) => {
        filtroTexto = e.target.value;
        renderizarPrompts();
      });
      document.getElementById("filtro-categoria").addEventListener("change", renderizarPrompts);
      onDadosMudarem("prompts", renderizarPrompts);
      onDadosMudarem("favoritos", renderizarPrompts);
      onDadosMudarem("categorias", () => popularSelectsCategoria());
    });

    document.getElementById("botao-novo-prompt").addEventListener("click", () => abrirModal());
    document.getElementById("modal-fechar").addEventListener("click", fecharModal);
    document.getElementById("modal-cancelar").addEventListener("click", fecharModal);
    document.getElementById("modal-backdrop").addEventListener("click", (e) => { if (e.target.id === "modal-backdrop") fecharModal(); });
    document.getElementById("modal-salvar").addEventListener("click", salvarPrompt);
    document.getElementById("modal-excluir").addEventListener("click", () => {
      const id = document.getElementById("campo-id").value;
      fecharModal();
      if (id) excluirPrompt(id);
    });

    document.getElementById("lista-historico").addEventListener("click", (e) => {
      const botao = e.target.closest("[data-usar-rapido]");
      if (botao) usarPrompt(botao.dataset.usarRapido, null);
    });

    document.getElementById("lista-prompts").addEventListener("click", (e) => {
      const botao = e.target.closest("[data-acao]");
      if (!botao) return;
      const id = botao.dataset.id;
      if (botao.dataset.acao === "editar") abrirModal(getPorId("prompts", id));
      if (botao.dataset.acao === "excluir") excluirPrompt(id);
      if (botao.dataset.acao === "usar") usarPrompt(id, botao);
      if (botao.dataset.acao === "favoritar") { alternarFavorito("prompt", id); renderizarPrompts(); }
    });
  </script>
</body>
</html>
