<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Ferramentas — Financeiro</title>

  <script>
    document.documentElement.dataset.theme = localStorage.getItem("ctf_tema") || "dark";
  </script>

  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
</head>
<body data-module="financeiro">
  <div class="app-shell">
    <div id="app-sidebar"></div>
    <div id="app-header"></div>

    <main class="app-main">
      <div class="page-header">
        <div>
          <h1>Financeiro</h1>
          <p style="color:var(--muted)">Entradas, saídas e contas a pagar/receber.</p>
        </div>
        <button class="btn btn-primary" id="botao-novo-lancamento">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
          Novo lançamento
        </button>
      </div>

      <div class="grid-resumo">
        <div class="card">
          <div class="card-resumo-label">Entradas (pagas)</div>
          <div class="card-resumo-valor" style="color:var(--success)" id="resumo-entradas">R$ 0,00</div>
        </div>
        <div class="card">
          <div class="card-resumo-label">Saídas (pagas)</div>
          <div class="card-resumo-valor" style="color:var(--danger)" id="resumo-saidas">R$ 0,00</div>
        </div>
        <div class="card">
          <div class="card-resumo-label">Saldo</div>
          <div class="card-resumo-valor" id="resumo-saldo">R$ 0,00</div>
        </div>
        <div class="card">
          <div class="card-resumo-label">Pendentes (a pagar/receber)</div>
          <div class="card-resumo-valor" style="color:var(--warning)" id="resumo-pendentes">R$ 0,00</div>
        </div>
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Data</th><th>Tipo</th><th>Descrição</th><th>Cliente</th>
              <th>Status</th><th style="text-align:right;">Valor</th><th></th>
            </tr>
          </thead>
          <tbody id="lista-lancamentos"></tbody>
        </table>
      </div>
      <div id="estado-vazio" class="empty-state" hidden>
        <h3>Nenhum lançamento ainda</h3>
        <p>Registre a primeira entrada ou saída.</p>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-titulo">Novo lançamento</h3>
        <button class="icon-btn" id="modal-fechar" aria-label="Fechar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <input type="hidden" id="campo-id" />

      <div class="field">
        <label for="campo-tipo">Tipo *</label>
        <select class="input" id="campo-tipo">
          <option value="entrada">Entrada</option>
          <option value="saida">Saída</option>
        </select>
      </div>

      <div class="field">
        <label for="campo-descricao">Descrição *</label>
        <input class="input" id="campo-descricao" placeholder="Ex: Pagamento do projeto Redesign" />
      </div>

      <div style="display:flex; gap:10px;">
        <div class="field" style="flex:1;">
          <label for="campo-valor">Valor (R$) *</label>
          <input class="input" type="number" min="0" step="0.01" id="campo-valor" />
        </div>
        <div class="field" style="flex:1;">
          <label for="campo-data">Data *</label>
          <input class="input" type="date" id="campo-data" />
        </div>
      </div>

      <div class="field">
        <label for="campo-cliente">Cliente (opcional)</label>
        <select class="input" id="campo-cliente">
          <option value="">Nenhum</option>
        </select>
      </div>

      <div class="field">
        <label for="campo-projeto">Projeto (opcional)</label>
        <select class="input" id="campo-projeto">
          <option value="">Nenhum</option>
        </select>
      </div>

      <div class="field">
        <label for="campo-status">Status *</label>
        <select class="input" id="campo-status">
          <option value="pago">Pago / recebido</option>
          <option value="pendente">Pendente (a pagar/receber)</option>
        </select>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-excluir" style="margin-right:auto; color:var(--danger); display:none;">Excluir</button>
        <button class="btn btn-secondary" id="modal-cancelar">Cancelar</button>
        <button class="btn btn-primary" id="modal-salvar">Salvar</button>
      </div>
    </div>
  </div>

  <script>const CTF_RAIZ = "../";</script>

  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/events.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/db.js"></script>
  <script src="../assets/js/catalogo-menu.js"></script>
  <script src="../assets/js/partials.js"></script>
  <script src="../assets/js/app-shell.js" defer></script>

  <script defer>
    function popularSelectClientes(clienteId) {
      const select = document.getElementById("campo-cliente");
      select.innerHTML =
        '<option value="">Nenhum</option>' +
        getAll("clientes")
          .sort((a, b) => a.nome.localeCompare(b.nome))
          .map((c) => `<option value="${c.id}" ${c.id === clienteId ? "selected" : ""}>${c.nome}</option>`)
          .join("");
    }

    function popularSelectProjetos(projetoId) {
      document.getElementById("campo-projeto").innerHTML =
        '<option value="">Nenhum</option>' +
        getAll("projetos")
          .sort((a, b) => a.nome.localeCompare(b.nome))
          .map((p) => `<option value="${p.id}" ${p.id === projetoId ? "selected" : ""}>${p.nome}</option>`)
          .join("");
    }

    function linhaLancamento(l) {
      const cliente = l.clienteId ? getPorId("clientes", l.clienteId) : null;
      const projeto = l.projetoId ? getPorId("projetos", l.projetoId) : null;
      const classeValor = l.tipo === "entrada" ? "valor-entrada" : "valor-saida";
      const sinal = l.tipo === "entrada" ? "+" : "−";
      return `
        <tr>
          <td>${formatarData(l.data)}</td>
          <td><span class="badge ${l.tipo === "entrada" ? "badge--success" : "badge--accent"}">${l.tipo === "entrada" ? "Entrada" : "Saída"}</span></td>
          <td>${l.descricao}${projeto ? `<div style="font-size:11px; color:var(--muted);">📁 ${projeto.nome}</div>` : ""}</td>
          <td>${cliente ? `<span class="client-tag"><span class="client-dot" style="background:${cliente.cor}"></span>${cliente.nome}</span>` : "—"}</td>
          <td><span class="badge ${l.status === "pago" ? "badge--success" : "badge--warning"}">${l.status === "pago" ? "Pago" : "Pendente"}</span></td>
          <td style="text-align:right;" class="${classeValor}">${sinal} ${formatarMoeda(l.valor)}</td>
          <td style="text-align:right; white-space:nowrap;">
            <button class="icon-btn" data-acao="editar" data-id="${l.id}" title="Editar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            </button>
            <button class="icon-btn excluir" data-acao="excluir" data-id="${l.id}" title="Excluir">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
            </button>
          </td>
        </tr>`;
    }

    function renderizarLancamentos() {
      const lancamentos = getAll("lancamentos").sort((a, b) => b.data.localeCompare(a.data));
      const corpo = document.getElementById("lista-lancamentos");
      const vazio = document.getElementById("estado-vazio");

      if (lancamentos.length === 0) {
        corpo.innerHTML = "";
        vazio.hidden = false;
      } else {
        vazio.hidden = true;
        corpo.innerHTML = lancamentos.map(linhaLancamento).join("");
      }

      const pagos = lancamentos.filter((l) => l.status === "pago");
      const entradas = pagos.filter((l) => l.tipo === "entrada").reduce((s, l) => s + Number(l.valor), 0);
      const saidas = pagos.filter((l) => l.tipo === "saida").reduce((s, l) => s + Number(l.valor), 0);
      const pendentes = lancamentos.filter((l) => l.status === "pendente").reduce((s, l) => s + Number(l.valor), 0);

      document.getElementById("resumo-entradas").textContent = formatarMoeda(entradas);
      document.getElementById("resumo-saidas").textContent = formatarMoeda(saidas);
      document.getElementById("resumo-saldo").textContent = formatarMoeda(entradas - saidas);
      document.getElementById("resumo-saldo").style.color = entradas - saidas >= 0 ? "var(--success)" : "var(--danger)";
      document.getElementById("resumo-pendentes").textContent = formatarMoeda(pendentes);
    }

    function abrirModal(lancamento = null) {
      popularSelectClientes(lancamento?.clienteId);
      popularSelectProjetos(lancamento?.projetoId);
      document.getElementById("modal-titulo").textContent = lancamento ? "Editar lançamento" : "Novo lançamento";
      document.getElementById("modal-excluir").style.display = lancamento ? "inline-flex" : "none";
      document.getElementById("campo-id").value = lancamento?.id || "";
      document.getElementById("campo-tipo").value = lancamento?.tipo || "entrada";
      document.getElementById("campo-descricao").value = lancamento?.descricao || "";
      document.getElementById("campo-valor").value = lancamento?.valor ?? "";
      document.getElementById("campo-data").value = lancamento?.data || new Date().toISOString().slice(0, 10);
      document.getElementById("campo-status").value = lancamento?.status || "pago";
      document.getElementById("modal-backdrop").hidden = false;
      document.getElementById("campo-descricao").focus();
    }

    function fecharModal() {
      document.getElementById("modal-backdrop").hidden = true;
    }

    function salvarLancamento() {
      const id = document.getElementById("campo-id").value;
      const descricao = document.getElementById("campo-descricao").value.trim();
      const valor = parseFloat(document.getElementById("campo-valor").value);
      const data = document.getElementById("campo-data").value;
      if (!descricao || isNaN(valor) || !data) {
        document.getElementById(!descricao ? "campo-descricao" : !data ? "campo-data" : "campo-valor").focus();
        return;
      }
      const dados = {
        tipo: document.getElementById("campo-tipo").value,
        descricao,
        valor,
        data,
        clienteId: document.getElementById("campo-cliente").value || null,
        projetoId: document.getElementById("campo-projeto").value || null,
        status: document.getElementById("campo-status").value,
      };
      if (id) atualizar("lancamentos", id, dados);
      else inserir("lancamentos", dados);
      fecharModal();
      renderizarLancamentos();
    }

    window.addEventListener("ctf:shell-pronto", () => {
      renderizarLancamentos();
      onDadosMudarem("lancamentos", renderizarLancamentos);
      onDadosMudarem("clientes", renderizarLancamentos);
      onDadosMudarem("projetos", renderizarLancamentos);
    });

    document.getElementById("botao-novo-lancamento").addEventListener("click", () => abrirModal());
    document.getElementById("modal-fechar").addEventListener("click", fecharModal);
    document.getElementById("modal-cancelar").addEventListener("click", fecharModal);
    document.getElementById("modal-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "modal-backdrop") fecharModal();
    });
    document.getElementById("modal-salvar").addEventListener("click", salvarLancamento);
    document.getElementById("modal-excluir").addEventListener("click", () => {
      const id = document.getElementById("campo-id").value;
      if (id && confirm("Excluir este lançamento?")) {
        remover("lancamentos", id);
        fecharModal();
        renderizarLancamentos();
      }
    });

    document.getElementById("lista-lancamentos").addEventListener("click", (e) => {
      const botao = e.target.closest("[data-acao]");
      if (!botao) return;
      const id = botao.dataset.id;
      if (botao.dataset.acao === "editar") abrirModal(getPorId("lancamentos", id));
      if (botao.dataset.acao === "excluir") {
        if (confirm("Excluir este lançamento?")) {
          remover("lancamentos", id);
          renderizarLancamentos();
        }
      }
    });
  </script>
</body>
</html>
