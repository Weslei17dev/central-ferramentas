<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Ferramentas — Tickets</title>

  <script>
    document.documentElement.dataset.theme = localStorage.getItem("ctf_tema") || "dark";
  </script>

  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
</head>
<body data-module="tickets">
  <div class="app-shell">
    <div id="app-sidebar"></div>
    <div id="app-header"></div>

    <main class="app-main">
      <div class="page-header">
        <div>
          <h1>Tickets</h1>
          <p style="color:var(--muted)">Mini service desk — chamados vinculados a clientes, com SLA e prioridade.</p>
        </div>
        <button class="btn btn-primary" id="botao-novo-ticket">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
          Novo ticket
        </button>
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>#</th><th>Título</th><th>Cliente</th><th>Prioridade</th>
              <th>Status</th><th>SLA</th><th>Responsável</th><th></th>
            </tr>
          </thead>
          <tbody id="lista-tickets"></tbody>
        </table>
      </div>
      <div id="estado-vazio" class="empty-state" hidden>
        <h3>Nenhum ticket aberto</h3>
        <p>Crie o primeiro chamado.</p>
      </div>
    </main>
  </div>

  <!-- Modal: novo ticket / editar informações básicas -->
  <div class="modal-backdrop" id="modal-backdrop-ticket" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-ticket-titulo">Novo ticket</h3>
        <button class="icon-btn" data-fechar-ticket aria-label="Fechar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <input type="hidden" id="campo-id" />

      <div class="field">
        <label for="campo-titulo">Título *</label>
        <input class="input" id="campo-titulo" placeholder="Ex: Site fora do ar" />
      </div>
      <div class="field">
        <label for="campo-descricao">Descrição</label>
        <textarea class="input" id="campo-descricao" rows="3" placeholder="Detalhes do problema ou solicitação"></textarea>
      </div>
      <div class="field">
        <label for="campo-cliente">Cliente *</label>
        <select class="input" id="campo-cliente"></select>
      </div>
      <div style="display:flex; gap:10px;">
        <div class="field" style="flex:1;">
          <label for="campo-prioridade">Prioridade</label>
          <select class="input" id="campo-prioridade">
            <option value="baixa">Baixa (SLA 48h)</option>
            <option value="media" selected>Média (SLA 24h)</option>
            <option value="alta">Alta (SLA 8h)</option>
            <option value="urgente">Urgente (SLA 4h)</option>
          </select>
        </div>
        <div class="field" style="flex:1;">
          <label for="campo-responsavel">Responsável</label>
          <select class="input" id="campo-responsavel"><option value="">Nenhum</option></select>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-fechar-ticket>Cancelar</button>
        <button class="btn btn-primary" id="ticket-salvar">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Modal: detalhe do ticket (SLA, status, comentários, tempo, anexos) -->
  <div class="modal-backdrop" id="modal-backdrop-detalhe" hidden>
    <div class="modal modal--largo" id="conteudo-detalhe"></div>
  </div>

  <input type="file" id="input-anexo" hidden />

  <script>const CTF_RAIZ = "../";</script>

  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/events.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/db.js"></script>
  <script src="../assets/js/idb-arquivos.js"></script>
  <script src="../assets/js/catalogo-menu.js"></script>
  <script src="../assets/js/partials.js"></script>
  <script src="../assets/js/app-shell.js" defer></script>

  <script defer>
    const STATUS_LABEL = { aberto: "Aberto", andamento: "Em andamento", aguardando: "Aguardando cliente", resolvido: "Resolvido", fechado: "Fechado" };
    const PRIORIDADE_LABEL = { baixa: "Baixa", media: "Média", alta: "Alta", urgente: "Urgente" };
    let ticketDetalheAberto = null;

    function badgePrioridade(p) {
      const mapa = { urgente: "badge--accent", alta: "badge--warning", media: "badge--muted", baixa: "badge--muted" };
      return `<span class="badge ${mapa[p] || "badge--muted"}">${PRIORIDADE_LABEL[p] || p}</span>`;
    }

    function badgeStatus(s) {
      const mapa = { aberto: "badge--warning", andamento: "badge--accent", aguardando: "badge--muted", resolvido: "badge--success", fechado: "badge--muted" };
      return `<span class="badge ${mapa[s] || "badge--muted"}">${STATUS_LABEL[s] || s}</span>`;
    }

    function badgeSLA(ticket) {
      if (ticket.status === "resolvido" || ticket.status === "fechado") {
        return '<span class="badge badge--success">Concluído</span>';
      }
      const prazo = calcularPrazoSLA(ticket.criadoEm, ticket.prioridade);
      const restanteMs = prazo - new Date();
      if (restanteMs < 0) return '<span class="badge badge--accent">Vencido</span>';
      const horasRestantes = restanteMs / 3600000;
      if (horasRestantes < (SLA_HORAS[ticket.prioridade] || 24) * 0.25) {
        return `<span class="badge badge--warning">Vence em breve</span>`;
      }
      return `<span class="badge badge--success">No prazo</span>`;
    }

    function linhaTicket(ticket) {
      const cliente = getPorId("clientes", ticket.clienteId);
      return `
        <tr data-abrir="${ticket.id}" style="cursor:pointer;">
          <td style="font-family:var(--font-mono); color:var(--muted);">#${ticket.numero}</td>
          <td>${ticket.titulo}</td>
          <td>${cliente ? `<span class="client-tag"><span class="client-dot" style="background:${cliente.cor}"></span>${cliente.nome}</span>` : "—"}</td>
          <td>${badgePrioridade(ticket.prioridade)}</td>
          <td>${badgeStatus(ticket.status)}</td>
          <td>${badgeSLA(ticket)}</td>
          <td>${ticket.responsavelId ? getPorId("equipe", ticket.responsavelId)?.nome || "—" : "—"}</td>
          <td style="text-align:right;">
            <button class="icon-btn excluir" data-excluir="${ticket.id}" title="Excluir">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
            </button>
          </td>
        </tr>`;
    }

    function renderizarLista() {
      const tickets = getAll("tickets").sort((a, b) => b.criadoEm.localeCompare(a.criadoEm));
      const corpo = document.getElementById("lista-tickets");
      const vazio = document.getElementById("estado-vazio");
      corpo.innerHTML = tickets.map(linhaTicket).join("");
      vazio.hidden = tickets.length !== 0;
    }

    /* ---------- Modal de criação / edição básica ---------- */
    function popularSelectClientes(clienteId) {
      document.getElementById("campo-cliente").innerHTML = getAll("clientes")
        .sort((a, b) => a.nome.localeCompare(b.nome))
        .map((c) => `<option value="${c.id}" ${c.id === clienteId ? "selected" : ""}>${c.nome}</option>`)
        .join("");
    }

    function popularSelectResponsavel(responsavelId) {
      document.getElementById("campo-responsavel").innerHTML =
        '<option value="">Nenhum</option>' + getAll("equipe")
          .sort((a, b) => a.nome.localeCompare(b.nome))
          .map((m) => `<option value="${m.id}" ${m.id === responsavelId ? "selected" : ""}>${m.nome}</option>`)
          .join("");
    }

    function abrirModalTicket(ticket = null) {
      popularSelectClientes(ticket?.clienteId);
      popularSelectResponsavel(ticket?.responsavelId);
      document.getElementById("modal-ticket-titulo").textContent = ticket ? "Editar informações" : "Novo ticket";
      document.getElementById("campo-id").value = ticket?.id || "";
      document.getElementById("campo-titulo").value = ticket?.titulo || "";
      document.getElementById("campo-descricao").value = ticket?.descricao || "";
      document.getElementById("campo-prioridade").value = ticket?.prioridade || "media";
      document.getElementById("modal-backdrop-ticket").hidden = false;
      document.getElementById("campo-titulo").focus();
    }
    function fecharModalTicket() { document.getElementById("modal-backdrop-ticket").hidden = true; }

    function salvarTicket() {
      const id = document.getElementById("campo-id").value;
      const titulo = document.getElementById("campo-titulo").value.trim();
      const clienteId = document.getElementById("campo-cliente").value;
      if (!titulo || !clienteId) {
        document.getElementById("campo-titulo").focus();
        return;
      }
      const dados = {
        titulo,
        descricao: document.getElementById("campo-descricao").value.trim(),
        clienteId,
        prioridade: document.getElementById("campo-prioridade").value,
        responsavelId: document.getElementById("campo-responsavel").value || null,
      };
      if (id) {
        atualizar("tickets", id, dados);
      } else {
        const numeros = getAll("tickets").map((t) => t.numero || 0);
        const proximoNumero = numeros.length ? Math.max(...numeros) + 1 : 1;
        inserir("tickets", { ...dados, numero: proximoNumero, status: "aberto" });
      }
      fecharModalTicket();
      renderizarLista();
      if (ticketDetalheAberto) abrirDetalhe(ticketDetalheAberto);
    }

    function excluirTicket(id) {
      const ticket = getPorId("tickets", id);
      if (!confirm(`Excluir o ticket #${ticket.numero} — "${ticket.titulo}"? Comentários e tempo registrado também serão apagados.`)) return;
      getAll("ticketComentarios").filter((c) => c.ticketId === id).forEach((c) => remover("ticketComentarios", c.id));
      getAll("ticketTempos").filter((t) => t.ticketId === id).forEach((t) => remover("ticketTempos", t.id));
      remover("tickets", id);
      renderizarLista();
    }

    /* ---------- Modal de detalhe (SLA, comentários, tempo, anexos) ---------- */
    function abrirDetalhe(id) {
      ticketDetalheAberto = id;
      const ticket = getPorId("tickets", id);
      const cliente = getPorId("clientes", ticket.clienteId);
      const prazo = calcularPrazoSLA(ticket.criadoEm, ticket.prioridade);

      const comentarios = getAll("ticketComentarios").filter((c) => c.ticketId === id).sort((a, b) => a.criadoEm.localeCompare(b.criadoEm));
      const tempos = getAll("ticketTempos").filter((t) => t.ticketId === id);
      const totalMinutos = tempos.reduce((s, t) => s + Number(t.minutos), 0);
      const anexos = getAll("arquivos").filter((a) => a.ticketId === id);

      document.getElementById("conteudo-detalhe").innerHTML = `
        <div class="modal-header">
          <div>
            <h3>#${ticket.numero} — ${ticket.titulo}</h3>
            <div class="client-tag" style="margin-top:4px;">
              ${cliente ? `<span class="client-dot" style="background:${cliente.cor}"></span>${cliente.nome}` : "Cliente removido"}
            </div>
          </div>
          <button class="icon-btn" data-fechar-detalhe aria-label="Fechar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>

        ${ticket.descricao ? `<p style="color:var(--ink-soft); font-size:13px; margin-bottom:14px;">${ticket.descricao}</p>` : ""}

        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;">
          <div class="field" style="flex:1; min-width:140px;">
            <label>Status</label>
            <select class="input" id="det-status">
              ${Object.entries(STATUS_LABEL).map(([v, l]) => `<option value="${v}" ${v === ticket.status ? "selected" : ""}>${l}</option>`).join("")}
            </select>
          </div>
          <div class="field" style="flex:1; min-width:140px;">
            <label>Prazo de SLA (${SLA_HORAS[ticket.prioridade]}h)</label>
            <div style="height:38px; display:flex; align-items:center; gap:8px;">
              ${badgeSLA(ticket)} <span style="font-size:12px; color:var(--muted);">${formatarData(prazo.toISOString())}</span>
            </div>
          </div>
        </div>

        <div style="display:flex; gap:8px; margin-bottom:6px;">
          <button class="btn btn-secondary" id="det-editar" style="flex:1;">Editar informações</button>
          <button class="btn btn-secondary" id="det-excluir" style="color:var(--danger);">Excluir ticket</button>
        </div>

        <div class="subsection-title">Tempo registrado — total: ${Math.floor(totalMinutos / 60)}h${String(totalMinutos % 60).padStart(2, "0")}min</div>
        <div id="det-lista-tempos">
          ${tempos.length ? tempos.map((t) => `
            <div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); font-size:13px;">
              <span>${t.descricao || "Sem descrição"}</span>
              <span style="color:var(--muted);">${Math.floor(t.minutos / 60)}h${String(t.minutos % 60).padStart(2, "0")}min</span>
            </div>`).join("") : '<p style="color:var(--muted); font-size:13px;">Nenhum tempo registrado ainda.</p>'}
        </div>
        <div style="display:flex; gap:6px; margin-top:8px;">
          <input class="input" id="det-tempo-min" type="number" min="1" placeholder="Minutos" style="max-width:100px;" />
          <input class="input" id="det-tempo-desc" placeholder="Descrição (opcional)" style="flex:1;" />
          <button class="btn btn-secondary" id="det-tempo-add">Registrar</button>
        </div>

        <div class="subsection-title">Anexos</div>
        <div id="det-lista-anexos">
          ${anexos.length ? anexos.map((a) => `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--border); font-size:13px;">
              <span>${a.nome}</span>
              <div style="display:flex; gap:4px;">
                <button class="icon-btn" data-baixar-anexo="${a.id}" title="Baixar">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4.5 15.5v3a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-3"/></svg>
                </button>
                <button class="icon-btn excluir" data-excluir-anexo="${a.id}" title="Excluir">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
                </button>
              </div>
            </div>`).join("") : '<p style="color:var(--muted); font-size:13px;">Nenhum anexo ainda.</p>'}
        </div>
        <button class="btn btn-secondary" id="det-anexar" style="margin-top:8px; width:100%;">Anexar arquivo</button>

        <div class="subsection-title">Comentários</div>
        <div id="det-lista-comentarios">
          ${comentarios.length ? comentarios.map((c) => `
            <div style="padding:8px 0; border-bottom:1px solid var(--border);">
              <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:2px;">
                <strong style="color:var(--ink);">${c.autor || "Sem nome"}</strong>
                <span>${formatarData(c.criadoEm)}</span>
              </div>
              <p style="font-size:13px;">${c.texto}</p>
            </div>`).join("") : '<p style="color:var(--muted); font-size:13px;">Nenhum comentário ainda.</p>'}
        </div>
        <div style="display:flex; gap:6px; margin-top:8px;">
          <input class="input" id="det-comentario-autor" placeholder="Seu nome" style="max-width:140px;" />
          <input class="input" id="det-comentario-texto" placeholder="Escreva um comentário..." style="flex:1;" />
          <button class="btn btn-primary" id="det-comentario-add">Enviar</button>
        </div>
      `;

      ligarEventosDetalhe(id);
      document.getElementById("modal-backdrop-detalhe").hidden = false;
    }

    function ligarEventosDetalhe(id) {
      document.getElementById("det-status").addEventListener("change", (e) => {
        atualizar("tickets", id, { status: e.target.value });
        renderizarLista();
        abrirDetalhe(id);
      });
      document.querySelector("[data-fechar-detalhe]").addEventListener("click", fecharDetalhe);
      document.getElementById("det-editar").addEventListener("click", () => abrirModalTicket(getPorId("tickets", id)));
      document.getElementById("det-excluir").addEventListener("click", () => { fecharDetalhe(); excluirTicket(id); });

      document.getElementById("det-tempo-add").addEventListener("click", () => {
        const minutos = parseInt(document.getElementById("det-tempo-min").value, 10);
        if (!minutos || minutos <= 0) return;
        inserir("ticketTempos", { ticketId: id, minutos, descricao: document.getElementById("det-tempo-desc").value.trim() });
        abrirDetalhe(id);
      });

      document.getElementById("det-comentario-add").addEventListener("click", () => {
        const texto = document.getElementById("det-comentario-texto").value.trim();
        if (!texto) return;
        inserir("ticketComentarios", { ticketId: id, autor: document.getElementById("det-comentario-autor").value.trim(), texto, criadoEm: new Date().toISOString() });
        abrirDetalhe(id);
      });

      document.getElementById("det-anexar").addEventListener("click", () => document.getElementById("input-anexo").click());

      document.getElementById("det-lista-anexos").addEventListener("click", async (e) => {
        const baixar = e.target.closest("[data-baixar-anexo]");
        if (baixar) {
          const blob = await obterBlobArquivo(baixar.dataset.baixarAnexo);
          const meta = getPorId("arquivos", baixar.dataset.baixarAnexo);
          if (!blob) return;
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = meta.nome; a.click();
          URL.revokeObjectURL(url);
        }
        const excluir = e.target.closest("[data-excluir-anexo]");
        if (excluir) {
          await excluirBlobArquivo(excluir.dataset.excluirAnexo);
          remover("arquivos", excluir.dataset.excluirAnexo);
          abrirDetalhe(id);
        }
      });
    }

    function fecharDetalhe() {
      document.getElementById("modal-backdrop-detalhe").hidden = true;
      ticketDetalheAberto = null;
    }

    document.getElementById("input-anexo").addEventListener("change", async (e) => {
      const arquivo = e.target.files[0];
      e.target.value = "";
      if (!arquivo || !ticketDetalheAberto) return;
      const ticket = getPorId("tickets", ticketDetalheAberto);
      const registro = inserir("arquivos", {
        nome: arquivo.name, tipo: arquivo.type, tamanho: arquivo.size,
        clienteId: ticket.clienteId, projetoId: null, ticketId: ticketDetalheAberto,
        categoria: "Ticket", tags: [],
      });
      await salvarBlobArquivo(registro.id, arquivo);
      abrirDetalhe(ticketDetalheAberto);
    });

    window.addEventListener("ctf:shell-pronto", () => {
      renderizarLista();
      onDadosMudarem("tickets", renderizarLista);
      onDadosMudarem("clientes", renderizarLista);
      onDadosMudarem("equipe", renderizarLista);
    });

    document.getElementById("botao-novo-ticket").addEventListener("click", () => abrirModalTicket());
    document.querySelectorAll("[data-fechar-ticket]").forEach((el) => el.addEventListener("click", fecharModalTicket));
    document.getElementById("modal-backdrop-ticket").addEventListener("click", (e) => { if (e.target.id === "modal-backdrop-ticket") fecharModalTicket(); });
    document.getElementById("ticket-salvar").addEventListener("click", salvarTicket);

    document.getElementById("modal-backdrop-detalhe").addEventListener("click", (e) => { if (e.target.id === "modal-backdrop-detalhe") fecharDetalhe(); });

    document.getElementById("lista-tickets").addEventListener("click", (e) => {
      const excluir = e.target.closest("[data-excluir]");
      if (excluir) return excluirTicket(excluir.dataset.excluir);
      const linha = e.target.closest("[data-abrir]");
      if (linha) abrirDetalhe(linha.dataset.abrir);
    });
  </script>
</body>
</html>
